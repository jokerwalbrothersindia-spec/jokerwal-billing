/* ---------------- Premium PDF invoice (jsPDF) ---------------- */
function buildUpiUri(invoice){
  const vpa = (App.company.upiId||'').trim();
  if(!vpa) return null;
  const params = new URLSearchParams({
    pa: vpa, pn: App.company.name||'Merchant',
    am: (Number(invoice.balanceDue)||0).toFixed(2), cu:'INR',
    tn: 'Invoice '+invoice.invoiceNo,
  });
  return 'upi://pay?'+params.toString();
}
function makeQrDataUrl(text, size){
  return new Promise((resolve)=>{
    if(typeof QRCode==='undefined' || !text){ resolve(null); return; }
    const holder = document.createElement('div');
    holder.style.cssText='position:fixed;left:-9999px;top:-9999px;';
    document.body.appendChild(holder);
    try{
      new QRCode(holder, {text, width:size, height:size, correctLevel: QRCode.CorrectLevel.M});
      setTimeout(()=>{
        try{
          const canvas = holder.querySelector('canvas');
          const img = holder.querySelector('img');
          let dataUrl = null;
          if(canvas) dataUrl = canvas.toDataURL('image/png');
          else if(img && img.src && img.src.indexOf('data:')===0) dataUrl = img.src;
          resolve(dataUrl);
        }catch(e){ resolve(null); }
        finally{ holder.remove(); }
      }, 80);
    }catch(e){ holder.remove(); resolve(null); }
  });
}
async function generateInvoicePdf(invoice, items, opts){
  if(typeof window.jspdf==='undefined') throw new Error('The PDF library could not load. Please check your internet connection and try again.');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const pageW = 210, pageH = 297, marginX = 15;
  // Quotations reuse this exact layout (header/branding/watermark/signature all
  // stay identical) via an "invoice-shaped" adapter object — see
  // quotationToInvoiceShape() and generateQuotationPdf() — with only the title,
  // the No/Date/Payment line, the BILL TO label, the UPI QR (not shown — nothing
  // is actually due yet on an estimate) and the totals block's payment-specific
  // lines (Previous Balance/Total Payable/Received/Balance Due) differing.
  const isQuote = !!(opts && opts.docType === 'QUOTATION');
  const gstOn = !!invoice.gstEnabled;
  const c = App.company;
  // Header/footer band colours are customizable in Settings; accentDark (used
  // for headings/highlighted text) and accentLight (a pale tint for table
  // header bands) are derived from the chosen header colour so the whole
  // sheet stays visually consistent instead of clashing with a hardcoded gold.
  const accent = hexToRgb(c.headerColor, [162,115,44]);
  const accentDark = darkenRgb(accent, 0.58);
  const accentLight = lightenRgb(accent, 0.85);
  const footerAccent = hexToRgb(c.footerColor, accent);
  const gray=[100,95,85], lineGray=[224,218,204];

  // Faint, centered logo watermark in the page background — makes the sheet
  // feel branded/premium instead of leaving the lower half of the page bare
  // on short bills. Sized to the logo's real aspect ratio so it isn't
  // stretched. Silently skipped if there's no logo, or if this jsPDF build
  // doesn't support GState opacity (e.g. very old versions).
  let wmAspect = 1;
  if(c.logoDataUrl){
    try{
      wmAspect = await new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=> resolve(img.naturalWidth && img.naturalHeight ? img.naturalWidth/img.naturalHeight : 1);
        img.onerror = ()=> resolve(1);
        img.src = c.logoDataUrl;
      });
    }catch(e){}
  }
  function paintWatermark(){
    // Watermark is opt-out: on by default when a logo exists (existing
    // behaviour), but Settings > Invoice Customization has a toggle to turn
    // it off so the printed sheet comes out plain even with a logo set.
    if(!c.logoDataUrl || c.showWatermark===false) return;
    try{
      const boxSize = 130;
      let wmW = boxSize, wmH = boxSize;
      if(wmAspect>1) wmH = boxSize/wmAspect; else wmW = boxSize*wmAspect;
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({opacity:0.06}));
      doc.addImage(c.logoDataUrl,'PNG', (pageW-wmW)/2, 95+(boxSize-wmH)/2, wmW, wmH);
      doc.restoreGraphicsState();
    }catch(e){ /* GState not supported in this jsPDF build — skip watermark silently */ }
  }
  paintWatermark();

  // Non-registered businesses (no GSTIN) get a small "(Non-Registered
  // Business)" tag under the name/tagline — the header band grows by a few
  // mm to fit that extra line instead of crowding it against the tagline.
  // Logo size is customizable in Settings (Small/Medium/Large/Extra Large);
  // the header band also grows to fit a bigger logo so it never spills out.
  const showUnregTag = !c.gstin;
  const logoSize = Math.min(Math.max(Number(c.logoSizeMm)||16, 10), 32);
  const baseHeaderBandH = (c.tagline && showUnregTag) ? 32 : 26;
  const headerBandH = c.logoDataUrl ? Math.max(baseHeaderBandH, logoSize+10) : baseHeaderBandH;
  doc.setFillColor(...accent); doc.rect(0,0,pageW,headerBandH,'F');
  let logoW = 0;
  if(c.logoDataUrl){
    try{ doc.addImage(c.logoDataUrl,'PNG', marginX, (headerBandH-logoSize)/2, logoSize, logoSize); logoW = logoSize+4; }catch(e){}
  }
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(17);
  doc.text(c.name||'My Business', marginX+logoW, 13);
  let hLineY = 19.5;
  if(c.tagline){
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
    doc.text(c.tagline, marginX+logoW, hLineY);
    hLineY += 5.5;
  }
  if(showUnregTag){
    doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(250,240,225);
    doc.text('(Non-Registered Business)', marginX+logoW, hLineY);
  }

  let y = headerBandH + 8;
  // Each address/contact line is measured with splitTextToSize first and the
  // cursor is advanced by however many lines it actually wrapped to — a
  // fixed per-line step here would let a long address's wrapped 2nd line
  // overlap the next block (this caused the address to run into the Mobile/
  // Email line on longer addresses).
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...gray);
  const addrLineDefs = [
    [c.address1,c.address2].filter(Boolean).join(', '),
    [c.mobile?('Mobile: '+c.mobile):'', c.email?('Email: '+c.email):''].filter(Boolean).join('   '),
  ].filter(Boolean);
  const addrMaxW = 105, addrLineH = 4.6;
  let leftY = y;
  addrLineDefs.forEach((line)=>{
    const wrapped = doc.splitTextToSize(line, addrMaxW);
    doc.text(wrapped, marginX, leftY);
    leftY += wrapped.length * addrLineH;
  });
  // GSTIN/PAN line is pulled out of the plain gray address block and
  // highlighted (bold + accent colour) so it's easy to spot on the printed
  // invoice, per user request.
  const idLine = companyIdLine(c);
  if(idLine){
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...accentDark);
    const wrapped = doc.splitTextToSize(idLine, addrMaxW);
    doc.text(wrapped, marginX, leftY);
    leftY += wrapped.length * addrLineH;
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...accentDark);
  doc.text(isQuote?'QUOTATION':'INVOICE', pageW-marginX, y, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(20,20,20);
  doc.text('No: '+invoice.invoiceNo, pageW-marginX, y+6, {align:'right'});
  doc.text('Date: '+fmtDate(invoice.date), pageW-marginX, y+11, {align:'right'});
  if(isQuote){
    doc.text(invoice.validTill ? ('Valid Till: '+fmtDate(invoice.validTill)) : 'Estimate Only', pageW-marginX, y+16, {align:'right'});
  } else {
    doc.text('Payment: '+invoice.paymentMode, pageW-marginX, y+16, {align:'right'});
  }
  const rightY = y + 16;

  y = Math.max(leftY, rightY) + 8;
  doc.setDrawColor(...lineGray); doc.setFillColor(250,248,243);
  doc.rect(marginX, y, 180, 16, 'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...gray);
  doc.text(isQuote?'QUOTE FOR':'BILL TO', marginX+4, y+5.5);
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
  doc.text(String(invoice.customerName||''), marginX+4, y+11.5, {maxWidth:110});
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...gray);
  doc.text('Mobile: '+(invoice.mobile||''), pageW-marginX-4, y+11.5, {align:'right'});

  y += 22;
  const colsDef = gstOn
    ? [{k:'i',w:8,label:'#',align:'left'},{k:'name',w:52,label:'Item',align:'left'},{k:'hsn',w:20,label:'HSN',align:'left'},{k:'gst',w:16,label:'GST%',align:'right'},{k:'qty',w:18,label:'Qty',align:'right'},{k:'rate',w:30,label:'Rate',align:'right'},{k:'amt',w:36,label:'Amount',align:'right'}]
    : [{k:'i',w:10,label:'#',align:'left'},{k:'name',w:88,label:'Item',align:'left'},{k:'qty',w:24,label:'Qty',align:'right'},{k:'rate',w:28,label:'Rate',align:'right'},{k:'amt',w:30,label:'Amount',align:'right'}];
  const colX = []; { let cx=marginX; colsDef.forEach(cd=>{ colX.push(cx); cx+=cd.w; }); }
  const headerH = 8;
  const maxTableH = 95;
  let rowH = 7;
  if(items.length*rowH + headerH > maxTableH) rowH = Math.max(4.8, (maxTableH-headerH)/Math.max(items.length,1));
  const fontSize = rowH < 6 ? 7.3 : 8.3;

  doc.setFillColor(...accentLight); doc.rect(marginX, y, 180, headerH, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...accentDark);
  colsDef.forEach((cd,idx)=>{ const tx = cd.align==='right' ? colX[idx]+cd.w-2 : colX[idx]+2; doc.text(cd.label, tx, y+headerH-2.6, {align:cd.align}); });
  y += headerH;
  doc.setFont('helvetica','normal'); doc.setFontSize(fontSize); doc.setTextColor(20,20,20);
  items.forEach((it,i)=>{
    if(i%2===1){ doc.setFillColor(250,248,243); doc.rect(marginX,y,180,rowH,'F'); }
    const rowVals = gstOn
      ? {i:String(i+1), name:it.productName, hsn:it.hsn||'-', gst:(Number(it.gstRate)||0)+'%', qty:fmtNum(it.qty), rate:fmtMoneyPdf(it.rate), amt:fmtMoneyPdf(it.amount)}
      : {i:String(i+1), name:it.productName, qty:fmtNum(it.qty), rate:fmtMoneyPdf(it.rate), amt:fmtMoneyPdf(it.amount)};
    colsDef.forEach((cd,idx)=>{
      const tx = cd.align==='right' ? colX[idx]+cd.w-2 : colX[idx]+2;
      doc.text(String(rowVals[cd.k]==null?'':rowVals[cd.k]), tx, y+rowH-(rowH<6?1.6:2.2), {align:cd.align, maxWidth:cd.w-3});
    });
    y += rowH;
  });
  doc.setDrawColor(...lineGray); doc.line(marginX, y, marginX+180, y);
  y += 7;

  // If we're already deep on the page, continue totals/footer on a fresh page
  // instead of letting a long bill overlap the bottom margin. Threshold is
  // conservative (200, not right up against the table) because the totals +
  // terms box + QR/bank block + footer/signature strip below need a good
  // ~90mm of room to never spill past the bottom margin.
  if(y > 200){ doc.addPage(); paintWatermark(); y = 20; }

  const totalsX = pageW-marginX-72;
  const totalsTopY = y;
  function totalLine(label, value, opts){
    opts = opts||{};
    doc.setFont('helvetica', opts.bold?'bold':'normal'); doc.setFontSize(opts.size||9.5);
    doc.setTextColor(...(opts.color||[20,20,20]));
    doc.text(label, totalsX, y);
    doc.text(value, pageW-marginX, y, {align:'right'});
    y += opts.gap||5.6;
  }
  if(gstOn){
    totalLine('Taxable Amount', fmtMoneyPdf(invoice.taxableTotal));
    totalLine('CGST', fmtMoneyPdf((Number(invoice.gstTotal)||0)/2), {size:8.5,color:gray,gap:4.8});
    totalLine('SGST', fmtMoneyPdf((Number(invoice.gstTotal)||0)/2), {size:8.5,color:gray,gap:4.8});
  }
  if(isQuote){
    // A quotation is just an estimate — nothing is "due" yet, so none of the
    // payment-tracking lines below (Previous Balance/Total Payable/Received/
    // Balance Due) apply. Just the one clear total.
    totalLine('Quotation Total', fmtMoneyPdf(invoice.billTotal), {bold:true, size:12, color:accentDark});
  } else {
    totalLine('Bill Total', fmtMoneyPdf(invoice.billTotal), {bold:true});
    totalLine('Previous Balance', fmtMoneyPdf(invoice.previousBalance));
    totalLine('Total Payable', fmtMoneyPdf(invoice.totalPayable));
    totalLine('Received', fmtMoneyPdf(invoice.receivedAmount));
    doc.setDrawColor(...lineGray); doc.line(totalsX, y-3.5, pageW-marginX, y-3.5);
    totalLine('Balance Due', fmtMoneyPdf(invoice.balanceDue), {bold:true, size:11.5, color: Number(invoice.balanceDue)>0?[181,64,47]:[47,125,84]});
  }
  const totalsBottomY = y;

  // Terms & Conditions box fills the space to the LEFT of the totals column
  // (that column only ever used the right ~85mm of the page width, leaving
  // the rest blank). Width is back to using the full space left of the
  // totals column (like before); height is sized to the ACTUAL wrapped text
  // — matching the totals block's height was what made the box's bottom
  // edge land exactly on top of the "Amount in words" line below it — and
  // kept as compact as the content allows. Background is transparent (only
  // the border is drawn) instead of a filled box.
  let termsBottomY = totalsTopY - 6;
  if(c.invoiceTerms){
    const boxX = marginX, boxY = totalsTopY-6, boxW = totalsX-marginX-8;
    // splitTextToSize measures using whatever font/size is CURRENTLY set on
    // the doc — it must be set to the body font (7.3pt normal) before this
    // call, not after. Calling it while the previous (much larger, bold)
    // totals font was still active made jsPDF think each character was
    // wider than it really is, so it wrapped far too early — leaving the
    // box mostly empty on the right with the text squeezed into a narrow
    // column instead of using the full box width.
    doc.setFont('helvetica','normal'); doc.setFontSize(7.3);
    const wrappedTerms = doc.splitTextToSize(c.invoiceTerms, boxW-8);
    const boxH = Math.max(9 + wrappedTerms.length*3.4, 18);
    doc.setDrawColor(...lineGray);
    doc.rect(boxX, boxY, boxW, boxH, 'D');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...accentDark);
    doc.text('Terms & Conditions', boxX+4, boxY+5.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.3); doc.setTextColor(...gray);
    doc.text(wrappedTerms, boxX+4, boxY+10);
    termsBottomY = boxY + boxH;
  }

  y = Math.max(totalsBottomY, termsBottomY) + 4;
  doc.setFont('helvetica','bolditalic'); doc.setFontSize(8.5); doc.setTextColor(...gray);
  doc.text('Amount in words: '+amountInWordsIndian(invoice.totalPayable), marginX, y, {maxWidth:180});
  y += 10;

  if(y > 200){ doc.addPage(); paintWatermark(); y = 20; }

  let qrDataUrl = null;
  // No "Scan & Pay" QR on a quotation — nothing is actually payable yet on an estimate.
  if(!isQuote && c.upiId && Number(invoice.balanceDue)>0){
    try{ qrDataUrl = await makeQrDataUrl(buildUpiUri(invoice), 240); }catch(e){}
  }
  const blockTop = y;
  if(qrDataUrl){
    try{
      doc.addImage(qrDataUrl,'PNG', marginX, y, 26, 26);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...accentDark);
      doc.text('Scan & Pay via UPI', marginX, y+30);
    }catch(e){ qrDataUrl = null; }
  }
  if(c.invoiceBankDetails){
    const bankX = qrDataUrl ? marginX+35 : marginX;
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(20,20,20);
    doc.text('Bank Details', bankX, y+4);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...gray);
    doc.text(doc.splitTextToSize(c.invoiceBankDetails, 180-(bankX-marginX)), bankX, y+9);
  }
  y = blockTop + (qrDataUrl ? 34 : 4);

  // Signature block now follows the content closely (divider ~8mm below
  // whatever printed last — bank details/QR) instead of being force-pinned
  // near the bottom of the page — that fixed floor was what left a big,
  // awkward-looking blank gap between bank details and the footer on
  // shorter bills. A colored footer BAND is anchored to the bottom of the
  // page instead, as a deliberate design element, so any leftover blank
  // space trails naturally below the signature rather than sitting in the
  // middle of the page. Its color is customizable in Settings.
  const footerBandH = 16;
  const footerBandY = pageH - footerBandH;
  let dividerY = y + 8;
  if(dividerY + 31 > footerBandY - 4){ doc.addPage(); paintWatermark(); y = 20; dividerY = y + 8; }

  doc.setDrawColor(...lineGray); doc.line(marginX, dividerY, pageW-marginX, dividerY);
  const sigRight = pageW-marginX, sigLeft = sigRight-55;
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...gray);
  doc.text('For '+(c.name||'Company'), sigRight, dividerY+7, {align:'right'});
  const sigLineY = dividerY+26; // ~19mm of blank space above the line, reserved for the actual signature
  // If an Authorized Signature photo is uploaded (Settings > Invoice Customization),
  // print it right there in that reserved blank gap so every bill already carries a
  // signature — no more signing each printed copy by hand.
  if(c.signatureDataUrl){
    const sigImgH = Math.min(13, sigLineY - (dividerY+8) - 1);
    const sigImgW = Math.min(45, sigRight-sigLeft);
    try{ doc.addImage(c.signatureDataUrl, 'PNG', sigRight-sigImgW, sigLineY-sigImgH-1, sigImgW, sigImgH); }catch(e){}
  }
  doc.setDrawColor(...lineGray); doc.line(sigLeft, sigLineY, sigRight, sigLineY);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(20,20,20);
  doc.text('Authorized Signatory', sigRight, sigLineY+5, {align:'right'});

  doc.setFillColor(...footerAccent); doc.rect(0, footerBandY, pageW, footerBandH, 'F');
  doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(255,255,255);
  doc.text(c.invoiceNote || 'Thank you for your business!', marginX, footerBandY+7, {maxWidth:130});
  if(c.website){ doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(255,255,255); doc.text(c.website, marginX, footerBandY+12.5); }

  return doc;
}
function printInvoice(invoice, items){
  generateInvoicePdf(invoice, items).then(doc=>{
    window.open(doc.output('bloburl'), '_blank');
  }).catch(e=>{ toast(e.message,'err'); });
}
// Shows a clear, persistent modal (never a transient toast) explaining that
// this device/browser can't hand a file straight to WhatsApp from a website —
// only the native phone Share Sheet can do that (see below) — so the PDF has
// been downloaded instead and must be attached by hand. A transient toast
// combined with an immediately-opened WhatsApp tab made it look like nothing
// had happened beyond "just a message", which is exactly what was reported.
function openManualAttachPdfModal(mobile, filename, msg){
  const body = el('div',{class:'stack'},[
    el('div',{},['The PDF file (', el('b',{},[filename]), ') has been downloaded to your device.']),
    el('div',{class:'small muted'},['This phone/browser does not support sending a PDF straight to WhatsApp as an attachment from a website — this is a phone/browser limitation. Tap "Open WhatsApp" below, then use 📎 (Attach) there to select and send the PDF file you just downloaded.']),
    el('button',{class:'btn btn-primary btn-block', onclick:()=>{ closeModal(); window.open(whatsappLink(mobile, msg), '_blank'); }},[iconWhatsapp(),'Open WhatsApp']),
    el('button',{class:'btn btn-block', onclick:closeModal},['Close']),
  ]);
  openModal('PDF Downloaded', body, {persist:true});
}
async function shareInvoicePdfWhatsApp(invoice, items){
  if(!invoice.mobile){ toast('No mobile number available.','err'); return; }
  const msg = 'Dear '+invoice.customerName+',\n\nThank you for shopping with '+App.company.name+'.\n'+
    'Invoice No: '+invoice.invoiceNo+'\nAmount: '+fmtMoney(invoice.billTotal)+'\nBalance Due: '+fmtMoney(invoice.balanceDue)+'\n\n'+
    'Thank you for your valuable purchase.';
  let doc;
  try{ doc = await generateInvoicePdf(invoice, items); }
  catch(e){ toast(e.message,'err'); return; }
  const filename = 'Invoice_'+invoice.invoiceNo.replace(/[^a-z0-9]+/gi,'_')+'.pdf';
  const blob = doc.output('blob');
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename, text:msg});
      toast('Shared.','ok');
      return;
    }
  }catch(e){
    // User themselves tapped "Cancel"/back on the native share sheet — respect
    // that and stop, instead of forcing a download + WhatsApp popup on them.
    if(e && e.name==='AbortError') return;
    /* real failure or Web Share unsupported here — fall through to the manual-attach flow below */
  }
  // Fallback: this device/browser has no Web Share (files) support at all, so
  // there is genuinely no way for a website to hand WhatsApp a file directly —
  // download the PDF and walk the user through attaching it by hand.
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){}
  openManualAttachPdfModal(invoice.mobile, filename, msg);
}
function sendInvoiceWhatsApp(invoice, items){
  if(items){ shareInvoicePdfWhatsApp(invoice, items); return; }
  if(!invoice.mobile){ toast('No mobile number available.','err'); return; }
  const msg = 'Dear '+invoice.customerName+',\n\nThank you for shopping with '+App.company.name+'.\n'+
    'Invoice No: '+invoice.invoiceNo+'\nAmount: '+fmtMoney(invoice.billTotal)+'\nBalance Due: '+fmtMoney(invoice.balanceDue)+'\n\n'+
    'Thank you for your valuable purchase.';
  window.open(whatsappLink(invoice.mobile, msg), '_blank');
}
/* ---------------- Customer Ledger PDF / WhatsApp (date-range statement) ---------------- */
// rowsDesc is ledgerForCustomer()'s result (newest-first). Splits it into the
// rows that actually fall inside [dateFrom, dateTo] (either can be blank =
// unbounded), plus the running balance just before the range started (so a
// filtered statement still shows a correct Opening Balance instead of 0).
function filterLedgerRange(rowsDesc, dateFrom, dateTo){
  const asc = rowsDesc.slice().reverse();
  const filtered = asc.filter(r=> (!dateFrom || r.date>=dateFrom) && (!dateTo || r.date<=dateTo));
  const before = dateFrom ? asc.filter(r=> r.date<dateFrom) : [];
  const openingBalance = before.length ? (Number(before[before.length-1].balance)||0) : 0;
  const closingBalance = filtered.length ? (Number(filtered[filtered.length-1].balance)||0) : openingBalance;
  return { filtered, openingBalance, closingBalance };
}
async function generateLedgerPdf(customer, filtered, openingBalance, closingBalance, dateFrom, dateTo, partyLabel){
  if(typeof window.jspdf==='undefined') throw new Error('The PDF library could not load. Please check your internet connection and try again.');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const pageW = 210, pageH = 297, marginX = 15;
  const c = App.company;
  const accent = hexToRgb(c.headerColor, [162,115,44]);
  const accentDark = darkenRgb(accent, 0.58);
  const accentLight = lightenRgb(accent, 0.85);
  const footerAccent = hexToRgb(c.footerColor, accent);
  const gray=[100,95,85], lineGray=[224,218,204];

  let wmAspect = 1;
  if(c.logoDataUrl){
    try{
      wmAspect = await new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=> resolve(img.naturalWidth && img.naturalHeight ? img.naturalWidth/img.naturalHeight : 1);
        img.onerror = ()=> resolve(1);
        img.src = c.logoDataUrl;
      });
    }catch(e){}
  }
  function paintWatermark(){
    // Watermark is opt-out: on by default when a logo exists (existing
    // behaviour), but Settings > Invoice Customization has a toggle to turn
    // it off so the printed sheet comes out plain even with a logo set.
    if(!c.logoDataUrl || c.showWatermark===false) return;
    try{
      const boxSize = 130; let wmW=boxSize, wmH=boxSize;
      if(wmAspect>1) wmH = boxSize/wmAspect; else wmW = boxSize*wmAspect;
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({opacity:0.06}));
      doc.addImage(c.logoDataUrl,'PNG', (pageW-wmW)/2, 95+(boxSize-wmH)/2, wmW, wmH);
      doc.restoreGraphicsState();
    }catch(e){}
  }
  paintWatermark();

  const showUnregTag = !c.gstin;
  const logoSize = Math.min(Math.max(Number(c.logoSizeMm)||16, 10), 32);
  const baseHeaderBandH = (c.tagline && showUnregTag) ? 32 : 26;
  const headerBandH = c.logoDataUrl ? Math.max(baseHeaderBandH, logoSize+10) : baseHeaderBandH;
  doc.setFillColor(...accent); doc.rect(0,0,pageW,headerBandH,'F');
  let logoW = 0;
  if(c.logoDataUrl){ try{ doc.addImage(c.logoDataUrl,'PNG', marginX, (headerBandH-logoSize)/2, logoSize, logoSize); logoW = logoSize+4; }catch(e){} }
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(17);
  doc.text(c.name||'My Business', marginX+logoW, 13);
  let hLineY = 19.5;
  if(c.tagline){
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
    doc.text(c.tagline, marginX+logoW, hLineY);
    hLineY += 5.5;
  }
  if(showUnregTag){
    doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(250,240,225);
    doc.text('(Non-Registered Business)', marginX+logoW, hLineY);
  }

  let y = headerBandH + 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...gray);
  const addrLineDefs = [
    [c.address1,c.address2].filter(Boolean).join(', '),
    [c.mobile?('Mobile: '+c.mobile):'', c.email?('Email: '+c.email):''].filter(Boolean).join('   '),
  ].filter(Boolean);
  const addrMaxW = 105, addrLineH = 4.6;
  let leftY = y;
  addrLineDefs.forEach((line)=>{
    const wrapped = doc.splitTextToSize(line, addrMaxW);
    doc.text(wrapped, marginX, leftY);
    leftY += wrapped.length * addrLineH;
  });
  const idLine = companyIdLine(c);
  if(idLine){
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...accentDark);
    const wrapped = doc.splitTextToSize(idLine, addrMaxW);
    doc.text(wrapped, marginX, leftY);
    leftY += wrapped.length * addrLineH;
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...accentDark);
  doc.text('STATEMENT OF ACCOUNT', pageW-marginX, y, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(20,20,20);
  const periodLabel = (dateFrom||dateTo) ? (fmtDate(dateFrom)||'Start')+' to '+(fmtDate(dateTo)||'Today') : 'All Transactions';
  doc.text('Period: '+periodLabel, pageW-marginX, y+6, {align:'right'});
  doc.text('Generated: '+fmtDate(todayISO()), pageW-marginX, y+11, {align:'right'});
  const rightY = y + 11;

  y = Math.max(leftY, rightY) + 8;
  doc.setDrawColor(...lineGray); doc.setFillColor(250,248,243);
  doc.rect(marginX, y, 180, 16, 'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...gray);
  doc.text(partyLabel||'CUSTOMER', marginX+4, y+5.5);
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
  doc.text(String(customer.name||''), marginX+4, y+11.5, {maxWidth:110});
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...gray);
  doc.text('Mobile: '+(customer.mobile||''), pageW-marginX-4, y+11.5, {align:'right'});

  y += 22;
  const colsDef = [{k:'date',w:24,label:'Date',align:'left'},{k:'ref',w:62,label:'Reference',align:'left'},{k:'debit',w:32,label:'Debit',align:'right'},{k:'credit',w:31,label:'Credit',align:'right'},{k:'balance',w:31,label:'Balance',align:'right'}];
  const colX = []; { let cx=marginX; colsDef.forEach(cd=>{ colX.push(cx); cx+=cd.w; }); }
  const headerH = 8;

  function drawTableHeader(){
    doc.setFillColor(...accentLight); doc.rect(marginX, y, 180, headerH, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...accentDark);
    colsDef.forEach((cd,idx)=>{ const tx = cd.align==='right' ? colX[idx]+cd.w-2 : colX[idx]+2; doc.text(cd.label, tx, y+headerH-2.6, {align:cd.align}); });
    y += headerH;
  }

  const rows = [{date:dateFrom||'', ref:'Opening Balance', debit:'', credit:'', balance:fmtMoneyPdf(openingBalance), isOpening:true}]
    .concat(filtered.map(r=>({date:fmtDate(r.date), ref:(r.invoiceNo||'')+(r.remarks?(' — '+r.remarks):''), debit:r.debit?fmtMoneyPdf(r.debit):'', credit:r.credit?fmtMoneyPdf(r.credit):'', balance:fmtMoneyPdf(r.balance)})));
  const rowH = 7;
  const fontSize = 8.3;

  drawTableHeader();
  doc.setFont('helvetica','normal'); doc.setFontSize(fontSize); doc.setTextColor(20,20,20);
  rows.forEach((r,i)=>{
    if(y+rowH > 265){ doc.addPage(); paintWatermark(); y = 20; drawTableHeader(); doc.setFont(r.isOpening?'helvetica':'helvetica', r.isOpening?'italic':'normal'); doc.setFontSize(fontSize); doc.setTextColor(20,20,20); }
    if(r.isOpening){ doc.setFont('helvetica','italic'); doc.setTextColor(...gray); }
    else if(i%2===0){ doc.setFillColor(250,248,243); doc.rect(marginX,y,180,rowH,'F'); doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20); }
    else{ doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20); }
    colsDef.forEach((cd,idx)=>{
      const tx = cd.align==='right' ? colX[idx]+cd.w-2 : colX[idx]+2;

  doc.setDrawColor(...lineGray); doc.line(marginX, y, marginX+180, y);
  y += 7;

  if(y > 200){ doc.addPage(); paintWatermark(); y = 20; }

  const totalDebit = filtered.reduce((s,r)=> s+(Number(r.debit)||0), 0);
  const totalCredit = filtered.reduce((s,r)=> s+(Number(r.credit)||0), 0);
  const totalsX = pageW-marginX-72;
  function totalLine(label, value, opts){
    opts = opts||{};
    doc.setFont('helvetica', opts.bold?'bold':'normal'); doc.setFontSize(opts.size||9.5);
    doc.setTextColor(...(opts.color||[20,20,20]));
    doc.text(label, totalsX, y);
    doc.text(value, pageW-marginX, y, {align:'right'});
    y += opts.gap||5.6;
  }
  totalLine('Total Debit (Billed)', fmtMoneyPdf(totalDebit));
  totalLine('Total Credit (Received)', fmtMoneyPdf(totalCredit));
  doc.setDrawColor(...lineGray); doc.line(totalsX, y-3.5, pageW-marginX, y-3.5);
  totalLine('Closing Balance', fmtMoneyPdf(closingBalance), {bold:true, size:11.5, color: closingBalance>0?[181,64,47]:[47,125,84]});

  y += 6;
  if(y > 200){ doc.addPage(); paintWatermark(); y = 20; }

  // Same content-following-footer-band design as the invoice PDF: a colored
  // band anchored to the bottom of the page instead of a fixed floor, so
  // leftover blank space trails naturally below the summary.
  const footerBandH = 16;
  const footerBandY = pageH - footerBandH;
  if(y + 4 > footerBandY - 4){ doc.addPage(); paintWatermark(); y = 20; }
  doc.setFillColor(...footerAccent); doc.rect(0, footerBandY, pageW, footerBandH, 'F');
  doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(255,255,255);
  doc.text(c.invoiceNote || 'Thank you for your business!', marginX, footerBandY+7, {maxWidth:150});
  if(c.website){ doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(255,255,255); doc.text(c.website, marginX, footerBandY+12.5); }

  return doc;
}

async function shareLedgerPdfWhatsApp(customer, filtered, openingBalance, closingBalance, dateFrom, dateTo, partyLabel){
  if(!customer.mobile){ toast('No mobile number available.','err'); return; }
  const msg = 'Dear '+customer.name+',\n\nYour account statement is attached.\nClosing Balance: '+fmtMoney(closingBalance)+'\n\n— '+App.company.name;
  let doc;
  try{ doc = await generateLedgerPdf(customer, filtered, openingBalance, closingBalance, dateFrom, dateTo, partyLabel); }
  catch(e){ toast(e.message,'err'); return; }
  const filename = 'Statement_'+String(customer.name||customer.id).replace(/[^a-z0-9]+/gi,'_')+'.pdf';
  const blob = doc.output('blob');
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename, text:msg});
      toast('Shared.','ok');
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){}
  openManualAttachPdfModal(customer.mobile, filename, msg);
}

// Standard fixed-layout cheque print — a common Indian cheque leaf is roughly
// 200mm x 90mm landscape. Field positions (Pay/Amount/Date/Signature) match a
// typical bank cheque leaf but every printer/cheque-book combination differs
// slightly, so it's worth a test print on plain paper held against an actual
// cheque before feeding real cheque leaves through the printer.
async function generateChequePdf(opts){
  if(typeof window.jspdf==='undefined') throw new Error('The PDF library could not load. Please check your internet connection and try again.');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:[200,90], orientation:'landscape'});
  const pageW = 200;
  const gray=[100,95,85], lineGray=[190,190,190];

  const dateISO = opts.date || todayISO();
  const [yy,mm,dd] = dateISO.split('-');
  const digits = (dd+mm+yy).split('');
  const boxW = 6.2, boxH = 7.5, dateX0 = pageW-8-boxW*8, dateY0 = 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...gray);
  doc.text('Date', dateX0, dateY0-2);
  digits.forEach((ch,i)=>{
    const x = dateX0 + i*boxW;
    doc.setDrawColor(...lineGray); doc.rect(x, dateY0, boxW, boxH, 'D');
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
    doc.text(ch, x+boxW/2, dateY0+boxH-2.2, {align:'center'});
  });

  const payY = 33;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(20,20,20);
  doc.text('Pay', 10, payY);
  doc.setFont('helvetica','bold'); doc.setFontSize(12.5);
  doc.text(String(opts.payeeName||''), 23, payY, {maxWidth:115});
  doc.setDrawColor(...gray); doc.line(23, payY+1.8, 138, payY+1.8);
  doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(...gray);
  doc.text('OR BEARER', 141, payY);

  const amtBoxX = 148, amtBoxY = 22, amtBoxW = 44, amtBoxH = 11;
  doc.setDrawColor(...lineGray); doc.rect(amtBoxX, amtBoxY, amtBoxW, amtBoxH, 'D');
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...gray);
  doc.text('Rs.', amtBoxX-6, amtBoxY+amtBoxH-3);
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20,20,20);
  doc.text(Number(opts.amount||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}), amtBoxX+amtBoxW-2, amtBoxY+amtBoxH-3, {align:'right'});

  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(20,20,20);
  doc.text('Rupees', 10, 46);
  const wordsText = amountInWordsIndian(opts.amount||0);
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  const wrapped = doc.splitTextToSize(wordsText, 172);
  doc.text(wrapped, 30, 46);
  doc.setDrawColor(...gray); doc.line(10, 54, 190, 54);

  doc.setDrawColor(...lineGray); doc.line(140, 76, 190, 76);
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...gray);
  doc.text('Authorised Signatory', 165, 81, {align:'center'});

  if(opts.remarks){
    doc.setFont('helvetica','italic'); doc.setFontSize(7); doc.setTextColor(...gray);
    doc.text(String(opts.remarks), 10, 66, {maxWidth:120});
  }
  return doc;
}

/* ---------------- Product QR Code Labels (bulk/batch printing) ---------------- */
// Each label's QR encodes the product's Product Code — the same code the Sale/Purchase
// Bill "scan/type" box already accepts on Enter. Stick a label on the item and it can be
// scanned straight into a bill for fast billing.
async function generateProductLabelsPdf(items, layout){
  // items: [{productCode, name, rate, qty}] — rate is ALWAYS the Selling Price (MRP), never
  // the Purchase Cost, since this is what the customer sees and what a Sale Bill will
  // actually charge. qty = how many copies of that product's label to print.
  // layout: {cols, rows} — how many labels fit on one A4 sheet (user-configurable).
  if(typeof window.jspdf==='undefined') throw new Error('The PDF library could not load. Please check your internet connection and try again.');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
  const pageW = 210, pageH = 297;
  // Most home/office printers cannot physically print all the way to the paper
  // edge (their "unprintable margin" is commonly 4-5mm). At dense layouts
  // (32/40/65 labels per sheet) each label cell is small enough that even a
  // few mm of edge clipping visibly cuts into the outer row/column of labels
  // — this is what was reported ("40 label par print kiya to cut ho raha
  // hai"). A bigger outer margin here leaves real breathing room for that.
  //
  // Some shops instead use ready-made, pre-cut sticker/label sheets where the
  // labels already run edge-to-edge with zero gap and zero page margin (the
  // physical die-cut takes care of separating them) — printing OUR usual
  // margins/gaps on those would misalign every label against its own sticker.
  // layout.zeroMargin switches to a plain cols x rows grid filling the full
  // page with no margin, no gap, and no printed cut-guide border (which would
  // never line up with the sticker's real edge anyway) — the normal bordered/
  // gapped style stays the default so plain-paper printing is unaffected.
  const zeroMargin = !!(layout && layout.zeroMargin);
  const marginX = zeroMargin ? 0 : 8, marginY = zeroMargin ? 0 : 10;
  const cols = Math.max(1, Math.min(8, (layout&&layout.cols)||3));
  const rows = Math.max(1, Math.min(15, (layout&&layout.rows)||7));
  const gapX = zeroMargin ? 0 : 2.5, gapY = zeroMargin ? 0 : 2.5;
  const cellW = (pageW - marginX*2 - gapX*(cols-1)) / cols;
  const cellH = (pageH - marginY*2 - gapY*(rows-1)) / rows;

  // One QR image per unique product code, reused across all copies — much faster than
  // regenerating the same QR image again for every physical label.
  const qrCache = {};
  for(const it of items){
    if(!qrCache[it.productCode]){
      qrCache[it.productCode] = await makeQrDataUrl(it.productCode, 220);
    }
  }

  const labels = [];
  items.forEach(it=>{
    const n = Math.max(1, Math.min(500, Number(it.qty)||1));
    for(let i=0;i<n;i++) labels.push(it);
  });
  if(!labels.length) throw new Error('Enter at least one product and quantity.');

  let col=0, row=0;
  const companyName = String(App.company.name||'').slice(0,30);
  // Company name banner: a FILLED background band (shop's own header colour,
  // defaults to the gold theme) with bigger, bold, white text — reads like a
  // proper brand header instead of a thin line of small text. Capped at 6.5mm
  // tall so it stays sensible even on the biggest (12-per-sheet) labels.
  const headerH = Math.min(6.5, Math.max(4.5, cellH*0.24));
  const headerFontSize = Math.max(6, Math.min(9.5, headerH*1.45));
  const bannerRgb = hexToRgb(App.company.headerColor, [162,115,44]);
  labels.forEach((it, idx)=>{
    const x = marginX + col*(cellW+gapX);
    const y = marginY + row*(cellH+gapY);
    if(!zeroMargin){
      doc.setDrawColor(205,205,205);
      doc.rect(x, y, cellW, cellH, 'D');
    }
    // Company name banner across the top (branding — "shop premium lagegi").
    doc.setFillColor(bannerRgb[0], bannerRgb[1], bannerRgb[2]);
    doc.rect(x, y, cellW, headerH, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(headerFontSize); doc.setTextColor(255,255,255);
    doc.text(companyName, x+cellW/2, y+headerH/2+headerFontSize*0.14, {align:'center'});

    // Body: QR code on the LEFT, product details (name/MRP/code) on the RIGHT.
    const bodyY = y+headerH+1.4, bodyH = cellH-headerH-2.2;
    const qrSize = Math.max(6, Math.min(bodyH, cellW*0.4));
    const qrX = x+1.3, qrY = bodyY+(bodyH-qrSize)/2;
    const qrData = qrCache[it.productCode];
    if(qrData){ try{ doc.addImage(qrData,'PNG', qrX, qrY, qrSize, qrSize); }catch(e){} }

    const textX = qrX+qrSize+1.6, textW = (x+cellW-1.3)-textX;
    let ty = bodyY+2.6;
    // Product name: wraps onto up to TWO lines (instead of being cut off
    // mid-word on a single line) so a longer product name stays fully
    // readable rather than getting truncated.
    const nameFontSize = Math.max(5, Math.min(6.6, cellW*0.22));
    doc.setFont('helvetica','bold'); doc.setFontSize(nameFontSize); doc.setTextColor(20,20,20);
    let nameLines = doc.splitTextToSize(String(it.name||''), textW);
    if(nameLines.length > 2){
      const secondLine = String(nameLines[1]||'').replace(/.{0,3}$/, '') + '...';
      nameLines = [nameLines[0], secondLine];
    }
    const nameLineGap = Math.max(2.4, nameFontSize*0.42);
    nameLines.slice(0,2).forEach((line, li)=>{ doc.text(line, textX, ty + li*nameLineGap); });
    ty += nameLineGap*Math.min(nameLines.length,2) + Math.max(2.4, bodyH*0.2);

    doc.setFont('helvetica','bold'); doc.setFontSize(Math.max(5.5, Math.min(7.5, cellW*0.26))); doc.setTextColor(20,20,20);
    doc.text('MRP: '+fmtMoneyPdf(it.rate), textX, ty, {maxWidth:textW});
    ty += Math.max(3, bodyH*0.22);
    doc.setFont('helvetica','normal'); doc.setFontSize(Math.max(4.8, Math.min(6, cellW*0.2))); doc.setTextColor(110,110,110);
    doc.text(String(it.productCode||''), textX, ty);

    col++;
    if(col>=cols){ col=0; row++; }
    if(row>=rows && idx<labels.length-1){ doc.addPage(); row=0; col=0; }
  });
  return doc;
}

  function renderRows(){

        el('div',{class:'row', style:'align-items:center;gap:6px;'},[ el('span',{class:'tiny muted'},['Labels:']), qtyI, rm ]),

async function viewDashboard(root){
  const [invoices, customers, low] = await Promise.all([App.store.all('invoices'), App.masterStore.all('customers'), DB.lowStockList()]);
  const byNo = {}; invoices.forEach(r=>{ if(!byNo[r.invoiceNo] || r.createdAt>byNo[r.invoiceNo].createdAt) byNo[r.invoiceNo]=r; });
  const current = Object.values(byNo);
  const today = todayISO();
  const todaysBills = current.filter(r=>r.date===today && r.status!=='CANCELLED');
  const todaySales = todaysBills.reduce((s,r)=>s+Number(r.billTotal||0),0);
  const totalReceivable = customers.reduce((s,c)=>s+clamp0(Number(c.balance||0)),0);
  const recent = current.filter(r=>r.status!=='CANCELLED').sort((a,b)=> (a.createdAt<b.createdAt?1:-1)).slice(0,6);

  // last 7 days sales for bar chart
  const days = [];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const dayKey = (d)=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const dayTotals = days.map(d=>{
    const k = dayKey(d);
    return current.filter(r=>r.date===k && r.status!=='CANCELLED').reduce((s,r)=>s+Number(r.billTotal||0),0);
  });
  const maxDay = Math.max(1, ...dayTotals);

  root.appendChild(el('div',{class:'stack'},[
    low.length ? el('div',{class:'card pad', style:'border-color:var(--warning);background:var(--warning-soft);'},[
      el('div',{class:'row'},[iconLayers(), el('b',{},['Low Stock Alert']),]),
      el('div',{class:'small', style:'margin-top:4px;'},[low.map(p=>p.name+' ('+fmtNum(p.stock)+')').join(', ')]),
    ]) : null,

function statTile(label,val,tone){
  const toneColor = tone==='success'?'var(--success)':tone==='warning'?'var(--warning)':tone==='danger'?'var(--danger)':'var(--text)';
  // A separate accent-bar color (--tone custom property, read by .stat-tile's CSS
  // border-left): 'neutral'/untoned tiles still get a premium gold accent bar even
  // though their NUMBER stays plain text-colored (unchanged from before).
  const barColor = tone==='success'?'var(--success)':tone==='warning'?'var(--warning)':tone==='danger'?'var(--danger)':'var(--accent)';
  return el('div',{class:'stat-tile', style:'--tone:'+barColor},[ el('div',{class:'stat-num num', style:'color:'+toneColor},[val]), el('div',{class:'stat-label'},[label]) ]);
}

function statusPill(status){
  const map = {COMPLETED:['pill-success','Completed'], MODIFIED:['pill-credit','Modified'], CANCELLED:['pill-danger','Cancelled']};
  const [cls,label] = map[status] || ['pill-neutral', status];
  return el('span',{class:'pill '+cls},[label]);
}

  const gstOn = !!App.company.gstEnabled;

  billTotalLine.style.display = gstOn ? '' : 'none';

  function syncModeUI(){ amtLabelText.textContent = billDraft.paymentMode==='CREDIT' ? 'Advance Received (optional)' : 'Received Amount'; }

async function onSaveBill(){
  try{
    const b = {invoiceNo: billDraft.invoiceNo, date: billDraft.date, customerName: billDraft.customerName, mobile: billDraft.mobile, items: billDraft.items, paymentMode: billDraft.paymentMode, receivedAmount: billDraft.receivedAmount};
    let result;
    if(billDraft.editingInvoiceNo){ result = await DB.modifyBill(billDraft.editingInvoiceNo, b); }
    else{ result = await DB.saveBill(b); }
    if(result.lowStock.length) toast('Low stock: '+result.lowStock.map(p=>p.name).join(', '), 'err');
    toast('Bill saved successfully.', 'ok');
    // If this bill started life as a quotation (via "Convert to Bill"), mark
    // that quotation CONVERTED now that a real invoice actually exists for it.
    if(billDraft.convertingQuotationRowId){
      try{ await DB.markQuotationConverted(billDraft.convertingQuotationRowId, result.invoice.invoiceNo); }catch(e){}
    }
    showPostSaveOptions(result.invoice);
  }catch(e){ toast(e.message,'err'); }
}
async function showPostSaveOptions(invoice){
  const items = await DB.itemsForInvoiceRow(invoice.id);
  const body = el('div',{class:'stack'},[
    el('div',{},['Invoice ', el('b',{},[invoice.invoiceNo]), ' saved. ', fmtMoney(invoice.billTotal), ' total.']),
    el('button',{class:'btn btn-block', onclick:()=>printInvoice(invoice, items)},[iconPrint(),'Print Invoice']),
    el('button',{class:'btn btn-primary btn-block', onclick:()=>sendInvoiceWhatsApp(invoice, items)},[iconWhatsapp(),'Send PDF on WhatsApp']),
    el('div',{class:'small muted'},[invoice.mobile ? 'A confirmation message has already been sent to the customer. Tapping this button will open your phone\'s Share menu with the PDF invoice attached — choose WhatsApp to send it directly.' : 'Use the button below to generate the PDF invoice and send it via WhatsApp through your phone\'s Share menu.']),
    el('button',{class:'btn btn-block', onclick:async ()=>{ closeModal(); billDraft = freshDraft(await DB.nextInvoiceNo()); renderRoute(); }},['New Bill']),
  ]);
  openModal('Bill Saved', body, {persist:true});
  // Auto-send only a plain TEXT confirmation right after save (as previously
  // requested) — this always works since wa.me only ever supports pre-filled
  // text, never a file. The actual PDF can only reach WhatsApp through the
  // phone's native Share Sheet, which requires a fresh, direct tap on the
  // "Send PDF on WhatsApp" button above — browsers block navigator.share()
  // once too much async work (saving the bill, generating the PDF) has
  // happened since the last real tap, so attempting it here automatically
  // always silently failed and fell back to a confusing background download.
  if(invoice.mobile){ sendInvoiceWhatsApp(invoice); }
}

// Builds an "invoice-shaped" object from a quotation so it can be handed
// straight to generateInvoicePdf (with {docType:'QUOTATION'}) and reuse its
// entire header/branding/watermark/signature layout unchanged.
function quotationToInvoiceShape(q){
  return {
    invoiceNo: q.quoteNo, date: q.date, validTill: q.validTill, customerName: q.customerName, mobile: q.mobile,
    paymentMode:'', billTotal: q.quoteTotal, previousBalance:0, totalPayable:q.quoteTotal, receivedAmount:0, balanceDue:q.quoteTotal,
    taxableTotal: q.taxableTotal, gstTotal: q.gstTotal, gstEnabled: q.gstEnabled,
  };
}
function generateQuotationPdf(quotation, items){
  return generateInvoicePdf(quotationToInvoiceShape(quotation), items, {docType:'QUOTATION'});
}
function printQuotation(quotation, items){
  generateQuotationPdf(quotation, items).then(doc=>{
    window.open(doc.output('bloburl'), '_blank');
  }).catch(e=>{ toast(e.message,'err'); });
}
function quotationStatusPill(status){
  const map = {OPEN:['pill-neutral','Open'], CONVERTED:['pill-success','Converted'], CANCELLED:['pill-danger','Cancelled']};

// Hands a saved quotation's customer + items to the New Bill screen, ready to
// save as a real bill — actual saving still goes through the normal
// DB.saveBill()/onSaveBill() path (stock deduction, ledger, customer
// balance), which then marks this quotation CONVERTED (see onSaveBill()).
async function startConvertQuotationToBill(quotation){
  const items = await DB.itemsForQuotationRow(quotation.id);
  billDraft = freshDraft(await DB.nextInvoiceNo());
  billDraft.customerId = quotation.customerId;
  billDraft.customerName = quotation.customerName;
  billDraft.mobile = quotation.mobile;
  if(quotation.customerId){
    try{
      const cust = await App.masterStore.get('customers', quotation.customerId);
      billDraft.previousBalance = cust ? (Number(cust.balance)||0) : 0;
    }catch(e){}
  }
  billDraft.items = [];
  for(const it of items){
    let costRate = 0;
    try{ const prod = await DB.findProductByCode(it.productCode); costRate = prod ? (Number(prod.purchaseRate)||0) : 0; }catch(e){}
    billDraft.items.push({productCode: it.productCode, productName: it.productName, qty: Number(it.qty)||0, rate: Number(it.rate)||0, hsn: it.hsn||'', gstRate: Number(it.gstRate)||0, costRate});
  }
  billDraft.convertingQuotationRowId = quotation.id;
  toast('Quotation "'+quotation.quoteNo+'" loaded — click Save Bill to convert it into a real bill.');
  navigate('#/bill');
}

  const codeI = el('input',{value: p?p.id:(prefillCode||''), placeholder:'Leave blank to auto-generate'});
  const nameI = el('input',{value: p?p.name:(prefillName||'')});
  const rateI = el('input',{type:'number', value: p?p.rate:''});
  const costI = el('input',{type:'number', value: p? (p.purchaseRate||0) : '', placeholder:'0.00'});
  const typeI = el('select',{},[el('option',{value:'PIECE'},['Piece']), el('option',{value:'WEIGHT'},['Weight (gm)']), el('option',{value:'METER'},['Length (Meter)']), el('option',{value:'FEET'},['Length (Feet)'])]);
  typeI.value = p?p.qtyType:'PIECE';
  const stockI = el('input',{type:'number', value: p? p.stock : 0});
  const lowI = el('input',{type:'number', value: p? (p.lowStockLimit||0) : (App.company.lowStockDefault||0)});
  const hsnI = el('input',{value: p? (p.hsn||'') : '', placeholder:'e.g. 7117'});
  const gstRateI = el('input',{type:'number', min:'0', step:'any', value: p? (p.gstRate!=null?p.gstRate:(App.company.defaultGstRate||0)) : (App.company.defaultGstRate||0)});
  const body = el('div',{class:'stack'},[
    el('label',{class:'field'},['QR / Product Code', codeI]),
    el('label',{class:'field'},['Product Name', nameI]),
    el('div',{class:'grid2'},[ el('label',{class:'field'},['Rate (₹) — the price you sell at', rateI]), el('label',{class:'field'},['Purchase Cost (₹) — the price you bought at', costI]) ]),
    el('div',{class:'small muted'},['Keep Rate (selling) and Purchase Cost separate — only then will the Profit & Loss Report show the correct profit, even if you are selling at the same rate you bought at.']),
    el('div',{class:'grid2'},[ el('label',{class:'field'},['Qty Type', typeI]), el('label',{class:'field'},[isNew?'Opening Stock':'Stock', stockI]) ]),
    el('div',{class:'grid2'},[ el('label',{class:'field'},['Low Stock Limit', lowI]), null ]),
    App.company.gstEnabled ? el('div',{class:'grid2'},[ el('label',{class:'field'},['HSN Code', hsnI]), el('label',{class:'field'},['GST %', gstRateI]) ]) : null,
    el('div',{class:'row'},[
      el('button',{class:'btn btn-primary btn-block', onclick: async ()=>{
        const name = nameI.value.trim();
        if(!name){ toast('Enter the product name.','err'); return; }
        let code = codeI.value.trim().toUpperCase();
        if(!code) code = await DB.nextProductCode();
        if(isNew){
          const existing = await DB.findProductByCode(code);
          if(existing){ toast('This code already exists.','err'); return; }
        }
        const rec = p || {id:code, createdAt:new Date().toISOString()};
        rec.productCode = code; rec.name=name; rec.rate=Number(rateI.value)||0; rec.purchaseRate=Number(costI.value)||0; rec.qtyType=typeI.value;
        rec.stock=Number(stockI.value)||0; rec.lowStockLimit=Number(lowI.value)||0;
        rec.hsn = hsnI.value.trim(); rec.gstRate = Number(gstRateI.value)||0;
        await App.masterStore.put('products', rec);
        closeModal(); toast('Product saved.','ok');
        if(onSaved) onSaved(rec);
        renderRoute();
      }},[isNew?'Add Product':'Save Changes']),
    ]),
    !isNew ? el('button',{class:'btn btn-block', onclick:()=>openPrintLabelsModal([{productCode:p.productCode, name:p.name, rate:p.rate, qty:1}])},[iconPrint(),'Print QR Label']) : null,
    !isNew ? el('button',{class:'btn btn-danger btn-block', onclick: async ()=>{
      const ok = await confirmDialog('Delete this product?','Delete');
      if(ok){ await App.masterStore.del('products', p.id); closeModal(); toast('Deleted.'); renderRoute(); }
    }},[iconTrash(),'Delete Product']) : null,
  ]);
  openModal(isNew?'Add Product':'Edit Product', body);
}

async function viewDailyReport(root){
  const wrap = el('div',{class:'stack'});
  wrap.appendChild(el('div',{},[el('div',{class:'section-title'},['Daily Sales Report'])]));
  const dateI = el('input',{type:'date', value: todayISO()});
  wrap.appendChild(el('label',{class:'field', style:'max-width:220px;'},['Date', dateI]));
  const out = el('div',{class:'stack'});
  wrap.appendChild(out);
  root.appendChild(wrap);
  async function refresh(){
    const rows = await DB.currentInvoicesInRange(dateI.value, dateI.value);
    const active = rows.filter(r=>r.status!=='CANCELLED');
    const totalSales = active.reduce((s,r)=>s+Number(r.billTotal||0),0);
    const totalReceived = active.reduce((s,r)=>s+Number(r.receivedAmount||0),0);
    const totalCredit = active.reduce((s,r)=>s+Number(r.balanceDue||0),0);
    const cash = active.filter(r=>r.paymentMode==='CASH').reduce((s,r)=>s+Number(r.billTotal||0),0);
    const upi = active.filter(r=>r.paymentMode==='UPI').reduce((s,r)=>s+Number(r.billTotal||0),0);
    const completed = active.filter(r=>r.status==='COMPLETED');
    const grossProfit = completed.reduce((s,r)=>s+Number(r.grossProfit||0),0);
    out.innerHTML='';
    out.appendChild(el('div',{class:'grid3'},[
      statTile('Bills', String(active.length),'neutral'), statTile('Sales', fmtMoney(totalSales),'success'), statTile('Received', fmtMoney(totalReceived),'neutral'),
      statTile('Credit Out', fmtMoney(totalCredit),'warning'), statTile('Cash', fmtMoney(cash),'neutral'), statTile('UPI', fmtMoney(upi),'neutral'),
      statTile('Profit', fmtMoney(grossProfit), grossProfit>=0?'success':'danger'),
    ]));
    const card = el('div',{class:'card pad'});
    if(!rows.length) card.appendChild(el('div',{class:'empty'},['No bills on this day.']));
    else rows.forEach(r=>card.appendChild(invoiceListRow(r)));
    out.appendChild(card);
  }
  const safeRefresh = guardedRefresh(refresh, out);
  dateI.addEventListener('change',safeRefresh);
  await safeRefresh();
}
async function viewMonthlyReport(root){
  const wrap = el('div',{class:'stack'});
  wrap.appendChild(el('div',{},[el('div',{class:'section-title'},['Monthly Sales Report'])]));
  const now = new Date();
  const monthI = el('input',{type:'month', value: now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')});
  wrap.appendChild(el('label',{class:'field', style:'max-width:220px;'},['Month', monthI]));
  const out = el('div',{class:'stack'});
  wrap.appendChild(out);
  root.appendChild(wrap);
  async function refresh(){
    const [y,m] = monthI.value.split('-').map(Number);
    const first = y+'-'+String(m).padStart(2,'0')+'-01';
    const lastDate = new Date(y,m,0).getDate();
    const last = y+'-'+String(m).padStart(2,'0')+'-'+String(lastDate).padStart(2,'0');
    const all = await DB.currentInvoicesInRange(first,last);
    const rows = all.filter(r=>r.status==='COMPLETED');
    const totalSales = rows.reduce((s,r)=>s+Number(r.billTotal||0),0);
    const totalReceived = rows.reduce((s,r)=>s+Number(r.receivedAmount||0),0);
    const totalCredit = rows.reduce((s,r)=>s+Number(r.balanceDue||0),0);
    const cash = rows.filter(r=>r.paymentMode==='CASH').reduce((s,r)=>s+Number(r.billTotal||0),0);
    const upi = rows.filter(r=>r.paymentMode==='UPI').reduce((s,r)=>s+Number(r.billTotal||0),0);
    const grossProfit = rows.reduce((s,r)=>s+Number(r.grossProfit||0),0);
    const dayTotals = {};
    for(let d=1; d<=lastDate; d++){ dayTotals[d]=0; }
    rows.forEach(r=>{ const d = Number(r.date.split('-')[2]); dayTotals[d]=(dayTotals[d]||0)+Number(r.billTotal||0); });
    const maxDay = Math.max(1, ...Object.values(dayTotals));
    out.innerHTML='';
    out.appendChild(el('div',{class:'grid3'},[
      statTile('Bills', String(rows.length),'neutral'), statTile('Sales', fmtMoney(totalSales),'success'), statTile('Received', fmtMoney(totalReceived),'neutral'),
      statTile('Credit Out', fmtMoney(totalCredit),'warning'), statTile('Cash', fmtMoney(cash),'neutral'), statTile('UPI', fmtMoney(upi),'neutral'),
      statTile('Profit', fmtMoney(grossProfit), grossProfit>=0?'success':'danger'),
    ]));
    const chartCard = el('div',{class:'card pad'});
    chartCard.appendChild(el('div',{class:'bold small', style:'margin-bottom:6px;'},['Daily Breakdown']));
    const bar = el('div',{class:'bar-chart', style:'height:90px;'});
    for(let d=1; d<=lastDate; d++){
      bar.appendChild(el('div',{class:'bar-col'},[ el('div',{class:'bar', style:'height:'+Math.max(2,(dayTotals[d]/maxDay*70))+'px;'}), el('div',{class:'bar-label'},[String(d)]) ]));
    }
    chartCard.appendChild(bar);
    out.appendChild(chartCard);
    const card = el('div',{class:'card pad'});
    if(!rows.length) card.appendChild(el('div',{class:'empty'},['No bills this month.']));
    else rows.forEach(r=>card.appendChild(invoiceListRow(r)));
    out.appendChild(card);
  }
  const safeRefresh = guardedRefresh(refresh, out);
  monthI.addEventListener('change',safeRefresh);
  await safeRefresh();
}
async function viewProfitLossReport(root){
  const wrap = el('div',{class:'stack'});
  wrap.appendChild(el('div',{},[el('div',{class:'section-title'},['Profit & Loss Report']), el('div',{class:'section-sub'},['Real profit from the difference between Selling Rate and Purchase Cost — even if both are sold at the same rate'])]));
  const filterRow = el('div',{class:'row wrap'});
  const fromI = el('input',{type:'date', value: (()=>{const d=new Date(); d.setDate(d.getDate()-30); return d.toISOString().slice(0,10);})()});
  const toI = el('input',{type:'date', value: todayISO()});
  filterRow.appendChild(el('label',{class:'field'},['From', fromI]));
  filterRow.appendChild(el('label',{class:'field'},['To', toI]));
  wrap.appendChild(filterRow);
  const out = el('div',{class:'stack'});
  wrap.appendChild(out);
  root.appendChild(wrap);
  async function refresh(){
    const all = await DB.currentInvoicesInRange(fromI.value, toI.value);
    const rows = all.filter(r=>r.status==='COMPLETED');
    const totalSales = rows.reduce((s,r)=>s+Number(r.taxableTotal!=null?r.taxableTotal:r.billTotal||0),0);
    const totalCost = rows.reduce((s,r)=>s+Number(r.totalCost||0),0);
    const grossProfit = totalSales - totalCost;
    const marginPct = totalSales>0 ? (grossProfit/totalSales*100) : 0;
    out.innerHTML='';
    out.appendChild(el('div',{class:'grid3'},[
      statTile('Bills', String(rows.length),'neutral'),
      statTile('Total Sales', fmtMoney(totalSales),'success'),
      statTile('Total Purchase Cost', fmtMoney(totalCost),'neutral'),
      statTile('Gross Profit', fmtMoney(grossProfit), grossProfit>=0?'success':'danger'),
      statTile('Profit Margin', marginPct.toFixed(1)+'%', grossProfit>=0?'success':'danger'),
    ]));
    if(rows.some(r=>r.totalCost==null)){
      out.appendChild(el('div',{class:'small muted', style:'padding:2px 0;'},['Note: some old bills were created before the product\'s Purchase Cost was set — their profit may show as 0/low here. New bills created after entering "Purchase Cost" in the product will show the correct profit.']));
    }
    const card = el('div',{class:'card pad'});
    if(!rows.length){ card.appendChild(el('div',{class:'empty'},['No completed bills in this date range.'])); }
    else{
      rows.sort((a,b)=> (a.date<b.date?1:-1));
      rows.forEach(r=>{
        const sales = Number(r.taxableTotal!=null?r.taxableTotal:r.billTotal||0);
        const profit = Number(r.grossProfit||0);
        card.appendChild(el('div',{class:'list-row', onclick:()=>openInvoiceDetail(r)},[
          el('div',{},[ el('div',{class:'bold small'},[r.invoiceNo]), el('div',{class:'tiny muted'},[r.customerName+' • '+fmtDate(r.date)]) ]),
          el('div',{style:'text-align:right;'},[ el('div',{class:'small num'},[fmtMoney(sales)]), el('div',{class:'tiny num', style:'color:'+(profit>=0?'var(--success)':'var(--danger)')},[(profit>=0?'+':'')+fmtMoney(profit)+' profit']) ]),
        ]));
      });
    }
    out.appendChild(card);
  }
  const safeRefresh = guardedRefresh(refresh, out);
  [fromI,toI].forEach(i=>i.addEventListener('change',safeRefresh));
  await safeRefresh();
}

/* ---------------- Backup / Restore ---------------- */
async function gatherBackup(){
  const [customers,products,invoices,saleItems,payments,ledger] = await Promise.all(
    ['customers','products','invoices','saleItems','payments','ledger'].map(s=>App.store.all(s))
  );
  return {app:'jokerwal-billing', version:1, exportedAt:new Date().toISOString(), company: App.company,
    data:{customers,products,invoices,saleItems,payments,ledger}};
}
async function exportBackup(){
  const backup = await gatherBackup();
  const json = JSON.stringify(backup, null, 2);
  const filename = 'backup_'+(App.company.name||'company').replace(/[^a-z0-9]+/gi,'_')+'_'+todayISO()+'.json';
  const blob = new Blob([json], {type:'application/json'});

  // 1) Claude artifact "downloads" capability (works when viewed inside claude.ai)
  try{
    if(window.claude && window.claude.use){
      const downloads = await window.claude.use('downloads');
      if(downloads){
        await downloads.save({filename, data: blob});
        toast('Backup saved.','ok');
        return;
      }
    }
  }catch(e){ /* declined / unavailable — fall through to other methods */ }

  // 2) Native share sheet (works well on Android, standalone or installed)
  try{
    if(navigator.canShare && navigator.share){
      const file = new File([blob], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); toast('Backup shared.','ok'); return; }
    }
  }catch(e){ /* user cancelled or unsupported — fall through */ }

  // 3) Plain browser download link (works when opened as a normal top-level page)
  let downloaded = false;
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    downloaded = true;
  }catch(e){ /* ignore, fallback below */ }

  // 4) Guaranteed fallback: show the JSON so it can be copied/saved manually
  showBackupTextModal(json, filename, downloaded);
}
function showBackupTextModal(json, filename, downloadTried){
  const ta = el('textarea',{style:'height:200px;font-size:10.5px;'});
  ta.value = json;
  const body = el('div',{class:'stack'},[
    el('div',{class:'small muted'},[downloadTried? 'Download has started (if it didn\'t, copy/save it from below).' : 'Copy the full backup from below and save it somewhere safe.']),
    ta,
    el('button',{class:'btn btn-primary btn-block', onclick: async ()=>{ try{ await navigator.clipboard.writeText(json); toast('Copied to clipboard.','ok'); }catch(e){ ta.select(); toast('Copy it manually (Ctrl/Cmd+C).'); } }},['Copy to Clipboard']),
  ]);
  openModal('Backup: '+filename, body);
}
function openImportBackup(){
  const fileI = el('input',{type:'file', accept:'application/json,.json'});
  const body = el('div',{class:'stack'},[
    el('div',{class:'small muted'},['Select a backup JSON file. This will REPLACE all of the current company\'s data.']),
    fileI,
    el('button',{class:'btn btn-danger btn-block', onclick: async ()=>{
      const f = fileI.files[0];
      if(!f){ toast('Select a file.','err'); return; }
      try{
        const text = await f.text();
        const parsed = JSON.parse(text);
        const ok = await confirmDialog('All of the current company\'s data will be replaced. Continue?','Restore');
        if(!ok) return;
        const d = parsed.data || parsed;
        for(const s of ['customers','products','invoices','saleItems','payments','ledger']){
          await App.store.clear(s);
          if(d[s] && d[s].length) await App.store.putAll(s, d[s]);
        }
        closeModal(); toast('Backup restored.','ok'); navigate('#/dashboard'); renderRoute();
      }catch(e){ toast('Invalid backup file.','err'); }
    }},['Restore Backup']),
  ]);
  openModal('Import Backup', body);
}

  const app = $('#app'); app.innerHTML='';

    mk('appId','App ID','1:123456789:web:abcdef'),

  app.appendChild(el('div',{class:'lock-screen'},[

        el('h2',{},['Cloud Setup']),

      ]),
      el('div',{class:'card pad'},[form]),
      el('div',{class:'small muted', style:'text-align:center;'},['These 6 values can be found in Firebase Console → Project Settings. See the SETUP GUIDE file provided for the complete steps.']),
    ]),

/* ---------------- Login / Sign Up / Forgot Password screen ---------------- */
function renderAuthScreen(mode){
  mode = mode || 'login';
  const app = $('#app'); app.innerHTML='';
  const emailI = el('input',{type:'email', placeholder:'you@example.com', autocomplete:'email'});
  const passI = el('input',{type:'password', placeholder:'Password', autocomplete: mode==='signup'?'new-password':'current-password'});
  const title = mode==='signup' ? 'Create New Account' : mode==='reset' ? 'Password Reset' : 'Log In';

  const stack = el('div',{class:'stack'});
  stack.appendChild(el('label',{class:'field'},['Email', emailI]));
  if(mode!=='reset') stack.appendChild(el('label',{class:'field'},['Password', passI]));

  const primaryBtn = el('button',{class:'btn btn-primary btn-block'},[mode==='signup'?'Sign Up':mode==='reset'?'Send Reset Link':'Login']);
  primaryBtn.addEventListener('click', async ()=>{
    const email = emailI.value.trim(); const pass = passI.value;
    if(!email){ toast('Enter your email.','err'); return; }
    primaryBtn.disabled = true;
    try{
      if(mode==='signup'){
        if(!pass || pass.length<6){ toast('Password must be at least 6 characters.','err'); primaryBtn.disabled=false; return; }
        await fbAuth.createUserWithEmailAndPassword(email, pass);
        toast('Account created! Your data will now be saved in the cloud.','ok');
      }else if(mode==='reset'){
        await fbAuth.sendPasswordResetEmail(email);
        toast('Password reset link sent to your email.','ok');
        renderAuthScreen('login');
        return;
      }else{
        await fbAuth.signInWithEmailAndPassword(email, pass);
      }
      // onAuthStateChanged listener (startAuthFlow) takes over from here.
    }catch(e){
      toast(authErrorMsg(e),'err');
      primaryBtn.disabled = false;
    }
  });
  stack.appendChild(primaryBtn);

  const links = el('div',{class:'row wrap', style:'justify-content:center;gap:16px;'});
  if(mode==='login'){
    links.appendChild(el('button',{class:'linklike', onclick:()=>renderAuthScreen('signup')},['Create a new account']));
    links.appendChild(el('button',{class:'linklike', onclick:()=>renderAuthScreen('reset')},['Forgot password?']));
  }else{
    links.appendChild(el('button',{class:'linklike', onclick:()=>renderAuthScreen('login')},['Back to Login']));
  }
  stack.appendChild(links);

  app.appendChild(el('div',{class:'lock-screen'},[
    el('div',{class:'stack', style:'max-width:380px;width:100%;'},[
      el('div',{class:'stack', style:'align-items:center;text-align:center;'},[
        el('div',{class:'brand-badge', style:'width:56px;height:56px;font-size:22px;'},['JB']),
        el('h2',{},[title]),
        el('div',{class:'muted small'},['Jokerwal Billing — cloud account (multi-device sync)']),
      ]),
      el('div',{class:'card pad'},[stack]),
      el('button',{class:'linklike small', style:'text-align:center;', onclick:()=>{ if(confirm('Change Firebase project?')){ clearFirebaseConfig(); localStorage.setItem(FORCE_SETUP_KEY,'1'); location.reload(); } }},['Change Firebase project']),
    ]),
  ]));
}

function startAuthFlow(){
  fbAuth.onAuthStateChanged(async (user)=>{
    if(user){
      App.uid = user.uid;
      App.userEmail = user.email;
      await bootApp();
    }else{
      App.uid = null; App.userEmail = null; App.company = null; App.store = null;
      if(App.clockTimer){ clearInterval(App.clockTimer); App.clockTimer = null; }
      renderAuthScreen('login');
    }
  }, (err)=>{ console.error(err); renderAuthScreen('login'); });
}

/* ---------------- PIN Lock screen ---------------- */
function renderLockScreen(){
  const app = $('#app'); app.innerHTML='';
  let entered='';
  const dots = el('div',{class:'pin-dots'});
  function refreshDots(){ dots.innerHTML=''; for(let i=0;i<Math.max(4,App.company.pin.length);i++){ dots.appendChild(el('div',{class:'pin-dot'+(i<entered.length?' filled':'')})); } }
  const keypad = el('div',{class:'keypad'});
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
    if(k===''){ keypad.appendChild(el('div',{})); return; }
    keypad.appendChild(el('button',{class:'btn', onclick:()=>{
      if(k==='⌫'){ entered = entered.slice(0,-1); }
      else if(entered.length<6){ entered += k; }
      refreshDots();
      if(entered.length===App.company.pin.length){
        if(entered===App.company.pin){ App.unlocked=true; app.innerHTML=''; renderRoute(); }
        else{ toast('Incorrect PIN.','err'); entered=''; setTimeout(refreshDots,120); }
      }
    }},[k]));
  });
  app.appendChild(el('div',{class:'lock-screen'},[
    el('div',{class:'stack', style:'align-items:center;max-width:280px;'},[
      el('div',{class:'brand-badge', style:'width:56px;height:56px;font-size:22px;'},[(App.company.name||'?').charAt(0).toUpperCase()]),
      el('h2',{},[App.company.name]),
      el('div',{class:'muted small'},['Enter PIN']),
      dots, keypad,
    ]),
  ]));
  refreshDots();
}

/* ---------------- Boot (runs once user is logged in) ---------------- */
async function bootApp(){
  try{
    if(!(await isAccountPaid())){ renderPaywallScreen(); return; }
    const companies = await ensureSeeded();
    let activeId = getActiveCompanyId();
    if(!companies.find(c=>c.id===activeId)) activeId = companies[0].id;
    await switchCompany(activeId);
    if(App.company.pin && !App.unlocked){ renderLockScreen(); }
    else{ renderRoute(); }
  }catch(e){
    console.error(e);
    const app = $('#app'); app.innerHTML='';
    app.appendChild(el('div',{class:'card pad', style:'margin:20px;'},['Startup error: '+e.message]));
  }
}

/* ---------------- Startup: load Firebase config, then auth, then app ---------------- */
function startup(){
  if(localStorage.getItem(FORCE_SETUP_KEY)){ localStorage.removeItem(FORCE_SETUP_KEY); renderSetupScreen(); return; }
  const cfg = loadFirebaseConfig();
  if(!cfg){ renderSetupScreen(); return; }
  try{
    initFirebase(cfg);
    startAuthFlow();
  }catch(e){
    console.error(e);
    toast('Could not connect to Firebase. Please try the setup again.','err');
    clearFirebaseConfig();
    renderSetupScreen();
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', startup); else startup();

})();
