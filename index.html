<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a2732c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JB Billing">
<meta name="description" content="Jokerwal Billing — cloud-synced multi-company billing &amp; inventory app">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Jokerwal Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ec; --surface:#ffffff; --surface-2:#faf7ef; --surface-3:#f2ead6; --border:#e6ddc6;
  --text:#221c12; --text-muted:#6f6650; --text-faint:#a89b7c;
  --accent:#b07f34; --accent-2:#8a5a1e; --accent-ink:#4a330f; --accent-soft:#f2e4c4; --accent-contrast:#fffaf0;
  --tint-bg:var(--accent-soft); --tint-fg:var(--accent-ink);
  --success:#28825a; --success-soft:#dcf1e4; --warning:#a5680c; --warning-soft:#faedd2;
  --danger:#b5402f; --danger-soft:#f8e2de; --credit:#2f6b8a; --credit-soft:#e2eef3;
  --shadow: 0 1px 2px rgba(30,24,10,.06), 0 10px 28px -10px rgba(30,24,10,.16);
  --glow: 0 0 20px -6px rgba(176,127,52,.45);
  --radial-glow: rgba(176,127,52,.09);
  --scrollbar-thumb: rgba(74,51,15,.22);
  --radius:14px; --radius-sm:9px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0c08; --surface:#171209; --surface-2:#1e180d; --surface-3:#292014; --border:#362b17;
    --text:#f4eddb; --text-muted:#b7a984; --text-faint:#7d7156;
    --accent:#e8b955; --accent-2:#c88f34; --accent-ink:#1c1406; --accent-soft:#3d2f16; --accent-contrast:#1c1406;
    --tint-bg:var(--accent-soft); --tint-fg:var(--accent);
    --success:#5ecd94; --success-soft:#153322; --warning:#e8b255; --warning-soft:#3a2c10;
    --danger:#e88b7a; --danger-soft:#3a1e19; --credit:#82c6e8; --credit-soft:#122938;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -12px rgba(0,0,0,.62);
    --glow: 0 0 26px -4px rgba(232,185,85,.4);
    --radial-glow: rgba(232,185,85,.10);
    --scrollbar-thumb: rgba(232,185,85,.18);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0c08; --surface:#171209; --surface-2:#1e180d; --surface-3:#292014; --border:#362b17;
  --text:#f4eddb; --text-muted:#b7a984; --text-faint:#7d7156;
  --accent:#e8b955; --accent-2:#c88f34; --accent-ink:#1c1406; --accent-soft:#3d2f16; --accent-contrast:#1c1406;
  --tint-bg:var(--accent-soft); --tint-fg:var(--accent);
  --success:#5ecd94; --success-soft:#153322; --warning:#e8b255; --warning-soft:#3a2c10;
  --danger:#e88b7a; --danger-soft:#3a1e19; --credit:#82c6e8; --credit-soft:#122938;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px -12px rgba(0,0,0,.62);
  --glow: 0 0 26px -4px rgba(232,185,85,.4);
  --radial-glow: rgba(232,185,85,.10);
  --scrollbar-thumb: rgba(232,185,85,.18);
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{
  background:
    radial-gradient(1000px 520px at 12% -8%, var(--radial-glow), transparent 60%),
    radial-gradient(800px 500px at 110% 10%, var(--radial-glow), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text); font-family:'Inter',system-ui,sans-serif;
}
.brandfont{font-family:'Fraunces',Georgia,serif;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0;}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
::selection{background:var(--accent-soft);}
.num{font-variant-numeric:tabular-nums;}
a{color:var(--credit);}

/* Premium scrollbar (webkit) — degrades gracefully elsewhere */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb); border-radius:8px; border:2px solid transparent; background-clip:padding-box;}

#app{min-height:100%; display:flex; flex-direction:column;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  position:relative;
}
.topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; pointer-events:none;
  background:linear-gradient(90deg, transparent 4%, var(--accent) 45%, var(--accent-2) 55%, transparent 96%);
  opacity:.6;
}
.topbar .brand{display:flex; align-items:center; gap:9px; min-width:0; flex:1;}
.brand-badge{
  width:36px; height:36px; border-radius:10px; background:linear-gradient(155deg,var(--accent),var(--accent-2));
  color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex:none;
  font-family:'Fraunces',serif; position:relative; overflow:hidden;
  box-shadow:0 4px 14px -5px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4);
}
.brand-badge::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(120deg, rgba(255,255,255,.35) 0%, transparent 35%);
}
.brand-name{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.005em;}
.brand-sub{font-size:11.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.icon-btn{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  transition:transform .12s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease;
}
@media (hover:hover){ .icon-btn:hover{background:var(--tint-bg); border-color:var(--accent); box-shadow:0 4px 14px -5px rgba(30,24,10,.3);} }
.icon-btn:active{transform:scale(.94);}

/* ---------- Layout shell ---------- */
.shell{display:flex; flex:1; min-height:0;}
.sidenav{
  width:220px; flex:none; border-right:1px solid var(--border); background:var(--surface);
  padding:16px 12px; display:none; flex-direction:column; gap:3px;
}
.main{flex:1; min-width:0; padding:16px 16px 96px; max-width:980px; margin:0 auto; width:100%;}
@media (min-width:860px){
  .sidenav{display:flex;}
  .main{padding:24px 28px 40px;}
  .bottomnav{display:none !important;}
}
.navitem{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer;
  color:var(--text-muted); font-size:13.5px; font-weight:500; border:1px solid transparent;
  transition:background-color .15s ease, color .15s ease, box-shadow .15s ease;
}
.navitem svg{flex:none; opacity:.8; transition:opacity .15s ease;}
.navitem:hover:not(.active){background:var(--surface-2); color:var(--text);}
.navitem:hover:not(.active) svg{opacity:1;}
.navitem.active{
  background:var(--tint-bg); color:var(--tint-fg); font-weight:700;
  box-shadow: inset 3px 0 0 var(--accent), 0 0 18px -8px var(--accent);
}
.navitem.active svg{opacity:1;}
.navgroup-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); padding:14px 11px 4px;}

.bottomnav{
  position:sticky; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
.bottomnav .navitem{flex:1; flex-direction:column; gap:3px; text-align:center; font-size:10.5px; padding:6px 2px; border-radius:10px; position:relative;}
.bottomnav .navitem.active{background:transparent; color:var(--tint-fg); box-shadow:none;}
.bottomnav .navitem.active::before{
  content:''; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
  width:18px; height:3px; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--accent-2));
  box-shadow:0 0 8px -1px var(--accent);
}
.bottomnav svg{width:20px; height:20px;}

/* ---------- Primitives ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.pad{padding:16px;}
.stack{display:flex; flex-direction:column; gap:12px;}
.row{display:flex; align-items:center; gap:10px;}
.wrap{flex-wrap:wrap;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr;}}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint);}
.small{font-size:12px;}
.tiny{font-size:11px;}
.bold{font-weight:700;}
.section-title{font-size:19px; font-weight:600; margin-bottom:2px;}
.section-sub{color:var(--text-muted); font-size:13px;}
.divider{height:1px; background:var(--border); border:none; margin:2px 0;}
.scroll-x{overflow-x:auto;}

label.field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--text-muted); font-weight:500;}
input,select,textarea{
  background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:9px 11px;
  color:var(--text); width:100%; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
textarea{resize:vertical; min-height:64px;}
.inline-input{width:auto;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); padding:10px 15px; font-weight:600; font-size:13.5px; cursor:pointer; white-space:nowrap;
  transition:transform .12s ease, box-shadow .15s ease, filter .15s ease, background-color .15s ease;
}
@media (hover:hover){
  .btn:hover{transform:translateY(-1px); box-shadow:0 4px 14px -4px rgba(30,24,10,.22); filter:brightness(1.04);}
  .btn-primary:hover{box-shadow:0 8px 24px -8px var(--accent-2), inset 0 1px 0 rgba(255,255,255,.3); filter:brightness(1.06); transform:translateY(-1px);}
  .btn-ghost:hover{background:var(--surface-2); box-shadow:none; filter:none;}
  .btn-danger:hover{background:var(--danger-soft);}
}
.btn:active{transform:scale(.98); box-shadow:none; filter:none;}
.btn-primary{
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); border-color:var(--accent-2); color:var(--accent-contrast);
  box-shadow:0 4px 16px -6px var(--accent-2), inset 0 1px 0 rgba(255,255,255,.22);
}
.btn-success{background:var(--success); border-color:var(--success); color:#fff;}
.btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:8px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.btn[disabled]:hover{transform:none; box-shadow:none; filter:none;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.02em;}
.pill-success{background:var(--success-soft); color:var(--success);}
.pill-warning{background:var(--warning-soft); color:var(--warning);}
.pill-danger{background:var(--danger-soft); color:var(--danger);}
.pill-credit{background:var(--credit-soft); color:var(--credit);}
.pill-neutral{background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:0 8px 8px; font-weight:600;}
td{padding:9px 8px; border-top:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.right{text-align:right;}
.center{text-align:center;}

.stat-tile{
  background:linear-gradient(180deg, var(--surface), var(--surface-2));
  border:1px solid var(--border); border-left:3px solid var(--tone, var(--accent));
  border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:6px;
  box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease;
}
@media (hover:hover){ .stat-tile:hover{transform:translateY(-2px); box-shadow:var(--shadow), 0 0 0 1px var(--tone, var(--accent)) inset;} }
.stat-num{font-size:21px; font-weight:700; font-family:'Fraunces',serif;}
.stat-label{font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(12,9,4,.55); z-index:100; display:flex; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(3px) saturate(1.1); -webkit-backdrop-filter:blur(3px) saturate(1.1);
  animation:jbFadeIn .18s ease both;
}
@media (min-width:640px){.modal-backdrop{align-items:center;}}
.modal{
  background:var(--surface); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.35), 0 0 0 1px var(--border);
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  position:relative; animation:jbSlideUp .22s cubic-bezier(.2,.8,.2,1) both;
}
.modal::before{
  content:''; position:absolute; top:0; left:16px; right:16px; height:2px; border-radius:2px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:.7;
}
@media (min-width:640px){.modal{border-radius:16px;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
@keyframes jbFadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes jbSlideUp{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);}}

.empty{padding:34px 14px; text-align:center; color:var(--text-muted);}
.empty svg{opacity:.4; margin-bottom:8px;}

.toast-wrap{position:fixed; left:0; right:0; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:200; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
@media (min-width:860px){.toast-wrap{bottom:24px;}}
.toast{background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); max-width:90vw;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}

.clock{font-family:'Fraunces',serif; text-align:right; flex:none; white-space:nowrap;}
.clock .time{font-size:13.5px; font-weight:600;}
.clock .date{font-size:9.5px; color:var(--text-muted);}
@media (max-width:360px){.clock .date{display:none;}}

.bar-chart{display:flex; align-items:flex-end; gap:6px; height:110px; padding-top:6px;}
.bar-chart .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; justify-content:flex-end; height:100%;}
.bar-chart .bar{width:100%; max-width:26px; background:linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius:5px 5px 2px 2px; min-height:2px; box-shadow:0 0 10px -3px var(--accent);}
.bar-chart .bar-label{font-size:9.5px; color:var(--text-faint); white-space:nowrap;}

.searchbox{position:relative;}
.searchbox input{padding-left:34px;}
.searchbox svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.55;}

.item-row{display:grid; grid-template-columns:1fr 52px 78px 78px 30px; gap:6px; align-items:center;}
.item-row input{padding:7px 8px; font-size:12.5px;}
.item-row .amt{font-size:12.5px; font-weight:600; text-align:right; padding-right:4px;}
/* On narrow phones a long product name in the 1fr column forced qty/rate/amount/delete
   into a single squeezed row floating beside several wrapped lines of the name — looks
   broken. Below 600px, reflow to two rows instead: name (+ delete) on its own row, then
   qty/rate/amount below it. Children are always in a fixed order (name, qty, rate,
   amount, delete) so we can target them positionally without touching the JS. */
@media (max-width:600px){
  .item-row{grid-template-columns: 1fr 1fr 1fr 26px; grid-template-areas:"name name name del" "qty rate amt amt"; row-gap:8px;}
  .item-row > *:nth-child(1){grid-area:name;}
  .item-row > *:nth-child(2){grid-area:qty;}
  .item-row > *:nth-child(3){grid-area:rate;}
  .item-row > *:nth-child(4){grid-area:amt; text-align:right;}
  .item-row > *:nth-child(5){grid-area:del; justify-self:end; align-self:start;}
}
/* Doc header (Invoice/Quotation No + Date): give the date field less forced width on
   narrow phones so a longer invoice number doesn't crowd/wrap right up against it. */
.doc-head{align-items:flex-start;}
.doc-head > div:first-child{min-width:0; flex:1;}
@media (max-width:480px){
  .doc-head .field{width:120px !important;}
  .doc-head .bold{font-size:14px; word-break:break-word;}
}

.linklike{background:none; border:none; padding:0; color:var(--credit); font-weight:600; cursor:pointer; font-size:inherit;}
.list-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 8px; border-top:1px solid var(--border);
  cursor:pointer; margin:0 -8px; border-radius:8px; transition:background-color .15s ease, transform .12s ease;
}
@media (hover:hover){ .list-row:hover{background:var(--surface-2); transform:translateX(2px);} }
.list-row:first-child{border-top:none;}
.list-row:active{background:var(--surface-2); transform:scale(.997);}
.avatar{
  width:36px; height:36px; border-radius:10px; background:linear-gradient(155deg, var(--tint-bg), var(--surface-2));
  color:var(--tint-fg); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none;
  box-shadow:inset 0 0 0 1px var(--border);
}

.print-sheet{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute; left:0; top:0; width:100%; padding:0;}
  .no-print{display:none !important;}
}
.invoice-doc{background:#fff; color:#111; padding:26px; font-family:'Inter',sans-serif; max-width:680px; margin:0 auto;}
.invoice-doc h2{font-family:'Fraunces',serif;}
.invoice-doc table{font-size:12.5px;}
.invoice-doc td, .invoice-doc th{border-color:#ddd; color:#111;}

.kbd-hint{font-size:11px; color:var(--text-faint);}
[hidden]{display:none !important;}
.scanline{display:flex; gap:8px;}
.scanline input{flex:1;}
.lock-screen{
  min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:
    radial-gradient(900px 480px at 20% -10%, var(--radial-glow), transparent 60%),
    radial-gradient(700px 460px at 100% 100%, var(--radial-glow), transparent 55%),
    var(--bg);
}
.pin-dots{display:flex; gap:12px; justify-content:center; margin:18px 0;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--border); transition:background-color .15s ease, box-shadow .15s ease;}
.pin-dot.filled{background:linear-gradient(155deg,var(--accent),var(--accent-2)); border-color:var(--accent); box-shadow:0 0 10px -2px var(--accent);}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:0 auto;}
.keypad button{padding:16px; font-size:18px; border-radius:12px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root" class="toast-wrap"></div>
<div id="modal-root"></div>
<div id="print-area"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

// Wraps a list-view's async `refresh()` so a failed Firestore read (a network
// blip, a transient offline-cache miss, etc.) shows a clear "connection
// problem, tap to retry" message inside that view's own container instead of
// silently leaving it blank — which is what used to happen: `refresh()` was
// called without `await` at the bottom of each view function, so if it threw,
// the rejection fired after the view's own try/catch in renderRoute() had
// already returned, and the error vanished with nothing shown on screen. The
// list looked like it had "disappeared", and reloading the page (a fresh
// renderRoute() call, a fresh Firestore read) usually succeeded, which is
// exactly the "gayab ho jata hai, refresh karne par wapas aa jata hai" pattern.
function guardedRefresh(fn, container){
  const wrapped = async (...args)=>{
    try{ await fn(...args); }
    catch(e){
      console.error(e);
      container.innerHTML='';
      container.appendChild(el('div',{class:'empty', style:'color:var(--danger);'},[
        el('div',{},['Connection problem — could not load data.']),
        el('div',{class:'tiny muted', style:'margin-top:4px;'},[String(e && e.message || e)]),
        el('button',{class:'btn btn-sm', style:'margin-top:8px;', onclick:()=>wrapped(...args)},['Try Again']),

    }
  };
  return wrapped;
}

/* Indian amount-in-words (ported from modAmountWords.bas) */
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function twoDigits(n){ if(n<20) return ONES[n]; return TENS[Math.floor(n/10)] + (n%10? ' '+ONES[n%10] : ''); }
function threeDigits(n){ let r=''; if(n>=100){ r = ONES[Math.floor(n/100)]+' Hundred'; if(n%100>0) r+=' '; } if(n%100>0) r += twoDigits(n%100); return r.trim(); }
function convertBelowCrore(n){
  let r='';
  const crore=Math.floor(n/10000000); n%=10000000;
  const lakh=Math.floor(n/100000); n%=100000;
  const thousand=Math.floor(n/1000); n%=1000;
  const hundred=Math.floor(n);
  if(crore>0) r += threeDigits(crore)+' Crore ';
  if(lakh>0) r += twoDigits(lakh)+' Lakh ';
  if(thousand>0) r += threeDigits(thousand)+' Thousand ';
  if(hundred>0) r += threeDigits(hundred);
  return r.trim();
}
function amountInWordsIndian(amount){
  amount = Math.max(0, Number(amount)||0);
  const rupees = Math.floor(amount);
  const paise = Math.round((amount-rupees)*100);
  let result = rupees===0 ? 'Zero Rupees' : convertBelowCrore(rupees)+' Rupees';
  if(paise>0) result += ' and '+twoDigits(paise)+' Paise';
  return result+' Only';
}

/* ---------------- Firestore-backed data store (per company) ----------------
   Same method interface as the earlier IndexedDB version, so all business
   logic below (DB object, view functions) works unchanged. Data now lives
   under  users/{uid}/companies/{companyId}/{storeName}/{docId}  in Cloud
   Firestore — safe even if this device/phone is lost, and available
   instantly on any other device after logging in with the same account. */
class Store{
  constructor(fs, uidVal, companyId){ this.fs=fs; this.uid=uidVal; this.companyId=companyId; }
  col(store){ return this.fs.collection('users').doc(this.uid).collection('companies').doc(this.companyId).collection(store); }
  async all(store){ const snap = await this.col(store).get(); return snap.docs.map(d=>d.data()); }
  async get(store,key){ if(key==null) return undefined; const doc = await this.col(store).doc(String(key)).get(); return doc.exists ? doc.data() : undefined; }
  async put(store,val){ await this.col(store).doc(String(val.id)).set(val); return val; }
  async del(store,key){ await this.col(store).doc(String(key)).delete(); }
  async byIndex(store, idx, val){ const snap = await this.col(store).where(idx,'==',val).get(); return snap.docs.map(d=>d.data()); }
  async clear(store){
    const snap = await this.col(store).get();
    if(snap.empty) return;
    const jobs=[]; let batch=this.fs.batch(); let n=0;
    snap.docs.forEach(d=>{ batch.delete(d.ref); n++; if(n===450){ jobs.push(batch.commit()); batch=this.fs.batch(); n=0; } });
    jobs.push(batch.commit());
    await Promise.all(jobs);
  }
  async putAll(store, arr){
    if(!arr || !arr.length) return;
    const jobs=[]; let batch=this.fs.batch(); let n=0;
    for(const val of arr){ batch.set(this.col(store).doc(String(val.id)), val); n++; if(n===450){ jobs.push(batch.commit()); batch=this.fs.batch(); n=0; } }
    jobs.push(batch.commit());
    await Promise.all(jobs);
  }
}

/* One-time, explicit import of the original JOKERWAL BROTHERS Excel history
   into the CURRENTLY ACTIVE company. Only relevant on the deployment built
   from that Excel file (window.__JB_SEED__ is embedded in index.html), and
   meant to be run once, into a fresh/empty company.

   IMPORTANT: window.__JB_SEED__ is baked into every copy of this app's
   built HTML — it is NOT scoped to any one login. This same app is used by
   more than one business (different email/password logins on the same
   cloud project), so this whole feature (button + function) must only ever
   be usable by the real JOKERWAL BROTHERS account — otherwise a different
   shop's login could import Jokerwal Brothers' own customers/products/
   invoices/ledger into THEIR company (exactly the bug reported: "Jokerwal
   ka data other account me update ho raha hai"). See isJbHistoryOwner()
   and JB_HISTORY_OWNER_EMAILS below, and removeImportedJbHistory() for the
   cleanup option offered to any account this already happened to. */
const JB_HISTORY_OWNER_EMAILS = ['jokerwalbrothers@gmail.com'];
function isJbHistoryOwner(){
  const email = String(App.userEmail||'').toLowerCase().trim();
  return !!email && JB_HISTORY_OWNER_EMAILS.indexOf(email) !== -1;
}
async function importHistoricalSeed(){
  if(typeof window.__JB_SEED__ === 'undefined'){ toast('No old history data is available in this version.','err'); return; }
  if(!isJbHistoryOwner()){ toast('This option is only for JOKERWAL BROTHERS\' own account.','err'); return; }
  const ok = await confirmDialog('This will add JOKERWAL BROTHERS\' old Excel history (customers, products, invoices, payments, ledger) into the "'+App.company.name+'" company. Use this only on an empty/new company — it may mix with existing data. Continue?', 'Import History');
  if(!ok) return;
  const seed = window.__JB_SEED__;
  await App.store.put('settings', Object.assign({}, App.company, seed.company, {id:'profile'}));
  await App.masterStore.putAll('customers', seed.data.customers);
  await App.masterStore.putAll('products', seed.data.products);
  await App.store.putAll('invoices', seed.data.invoices);
  await App.store.putAll('saleItems', seed.data.saleItems);
  await App.store.putAll('payments', seed.data.payments);
  await App.store.putAll('ledger', seed.data.ledger);
  App.company = await App.store.get('settings','profile');
  toast('History imported.','ok');
  navigate('#/dashboard'); renderShell2();
}

/* Cleanup for any account that already got JOKERWAL BROTHERS' history data
   imported by mistake (before the isJbHistoryOwner() restriction above
   existed). Since seed records were not tagged at import time, we detect
   them by matching against the seed's own fixed record IDs (window.__JB_SEED__
   never changes per-deployment) — so only the exact records that came from
   that import are found/removed, and anything the shop entered themselves
   (even a customer/product added after the import) is left untouched. */
async function findImportedJbHistoryIds(){
  if(typeof window.__JB_SEED__ === 'undefined' || !App.store) return null;
  const seed = window.__JB_SEED__;
  const storesToCheck = ['customers','products','invoices','saleItems','payments','ledger'];
  const result = {};
  let total = 0;
  for(const s of storesToCheck){
    const seedIds = new Set((seed.data[s]||[]).map(r=>r.id));
    if(!seedIds.size){ result[s] = []; continue; }
    let current = [];
    try{ current = await App.store.all(s); }catch(e){ current = []; }
    const matchIds = (current||[]).filter(r=>seedIds.has(r.id)).map(r=>r.id);
    result[s] = matchIds;
    total += matchIds.length;
  }
  return total>0 ? result : null;
}
async function removeImportedJbHistory(matches){
  const ok = await confirmDialog('The company "'+App.company.name+'" was found to have old JOKERWAL BROTHERS history data imported into it (perhaps by mistake). Only the customers/products/invoices/payments/ledger records that came from that import will be removed — the rest of your own data will stay completely safe; nothing extra will be deleted. Note: if the Company Profile (name/address/GST) changed because of the import, please review/correct it yourself in the fields above. Continue?', 'Remove Imported Data');
  if(!ok) return;
  toast('Removing data...');
  for(const storeName of Object.keys(matches)){
    for(const id of matches[storeName]){
      try{ await App.store.del(storeName, id); }catch(e){}
    }
  }
  toast('Imported JOKERWAL BROTHERS history data removed.','ok');
  renderRoute();
}

async function switchCompany(companyId){
  App.store = new Store(fbDb, App.uid, companyId);
  const DEFAULT_PROFILE = {id:'profile', pid:companyId, name:'New Company', tagline:'', address1:'', address2:'',
    mobile:'', email:'', website:'', gstin:'', pan:'', invoicePrefix:'INV', productPrefix:'PRD', purchasePrefix:'PUR', quotationPrefix:'QUO', lowStockDefault:5, pin:'',
    gstEnabled:false, defaultGstRate:0, invoiceNote:'Thank you for your business!', invoiceBankDetails:'', invoiceTerms:'', logoDataUrl:'', signatureDataUrl:'', upiId:'',
    headerColor:'#a2732c', footerColor:'#a2732c', logoSizeMm:16, showWatermark:true, sharedMasterFrom:''};
  let profile = await App.store.get('settings','profile');
  if(!profile){
    profile = Object.assign({}, DEFAULT_PROFILE);

  } else {

  }

/* Points App.masterStore at whichever company's Products/Customers master the
   ACTIVE company should read/write — its own (default) or another company's,
   when "Share Product & Customer Master Data" is turned ON in Settings (see
   viewSettings' "Data Sharing" card). Inventory (stock) and customer balances
   live wherever the master is, so two companies sharing a master genuinely
   share one product catalogue + customer list + running stock, while their
   own bills/invoices/ledger/payments always stay separate (App.store, never
   touched by this). If the configured source company no longer exists (e.g.
   it was deleted), this silently falls back to the company's own data
   instead of failing. */
async function refreshMasterStore(){
  const sourceId = App.company && App.company.sharedMasterFrom;
  if(sourceId && sourceId !== App.company.id){
    try{
      const companies = await loadCompanies();
      if(companies.some(co=>co.id===sourceId)){
        App.masterStore = new Store(fbDb, App.uid, sourceId);
        return;
      }
    }catch(e){}
  }
  App.masterStore = App.store;
}

/* ---------------- Data-access / business logic layer ---------------- */
const DB = {
  async nextInvoiceNo(){
    const fy = financialYear();
    const prefix = App.company.invoicePrefix || 'INV';
    const all = await App.store.all('invoices');
    const re = new RegExp('^'+prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'/'+fy+'/(\\d+)$');
    let max=0;
    all.forEach(inv=>{ const m = re.exec(inv.invoiceNo||''); if(m){ const n=parseInt(m[1],10); if(n>max) max=n; } });
    return prefix+'/'+fy+'/'+String(max+1).padStart(6,'0');
  },
  async nextCustomerId(){
    const all = await App.masterStore.all('customers');
    let max=0;
    all.forEach(c=>{ const m=/^CUS(\d+)$/.exec(c.id||''); if(m){ const n=parseInt(m[1],10); if(n>max) max=n; } });
    return 'CUS'+String(max+1).padStart(6,'0');
  },
  async nextProductCode(){
    const prefix = (App.company.productPrefix||'PRD').toUpperCase();
    const all = await App.masterStore.all('products');
    let max=0;
    const re = new RegExp('^'+prefix+'(\\d+)$');
    all.forEach(p=>{ const m = re.exec((p.productCode||'').toUpperCase()); if(m){ const n=parseInt(m[1],10); if(n>max) max=n; } });
    return prefix+String(max+1).padStart(6,'0');
  },
  async nextReceiptNo(){
    const all = await App.store.all('payments');
    let max=0;
    all.forEach(p=>{ const m=/^RC(\d+)$/.exec(p.id||''); if(m){ const n=parseInt(m[1],10); if(n>max) max=n; } });
    return 'RC'+String(max+1).padStart(6,'0');
  },
  async findCustomerByMobile(mobile){
    mobile = String(mobile||'').trim();
    if(!mobile) return null;
    const all = await App.masterStore.all('customers');
    return all.find(c=>String(c.mobile||'').trim()===mobile) || null;
  },
  async searchCustomers(text){
    const all = await App.masterStore.all('customers');
    text = (text||'').trim().toLowerCase();
    if(!text) return all;
    return all.filter(c=> (c.name||'').toLowerCase().includes(text) || String(c.mobile||'').includes(text) || (c.id||'').toLowerCase().includes(text));
  },
  async getOrCreateCustomer(mobile, name){
    mobile = String(mobile||'').trim(); name = (name||'').trim();
    let cust = await DB.findCustomerByMobile(mobile);
    if(cust){
      if(name && cust.name!==name){ cust.name = name; await App.masterStore.put('customers', cust); }
      return cust;
    }
    cust = {id: await DB.nextCustomerId(), mobile, name: name||'Walk-in Customer', balance:0, creditLimit:0, createdAt: new Date().toISOString()};
    await App.masterStore.put('customers', cust);
    return cust;
  },
  async searchProducts(text){
    const all = await App.masterStore.all('products');
    text = (text||'').trim().toLowerCase();
    if(!text) return all;
    return all.filter(p=> (p.name||'').toLowerCase().includes(text) || (p.productCode||'').toLowerCase().includes(text) || (p.id||'').toLowerCase().includes(text));
  },
  async findProductByCode(code){
    code = String(code||'').trim().toUpperCase();
    if(!code) return null;
    const all = await App.masterStore.all('products');
    return all.find(p=> (p.id||'').toUpperCase()===code || (p.productCode||'').toUpperCase()===code) || null;
  },
  async currentInvoiceRow(invoiceNo){
    const rows = await App.store.byIndex('invoices','invoiceNo', invoiceNo);
    const active = rows.filter(r=>r.status==='COMPLETED');
    if(active.length) return active.sort((a,b)=> (a.createdAt<b.createdAt?1:-1))[0];
    if(rows.length) return rows.sort((a,b)=> (a.createdAt<b.createdAt?1:-1))[0];
    return null;
  },
  async itemsForInvoiceRow(invoiceRowId){
    return App.store.byIndex('saleItems','invoiceNo', invoiceRowId);
  },
  computeTotals(items, previousBalance, receivedAmount, gstEnabled){
    const taxableTotal = items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.rate)||0), 0);
    const gstTotal = gstEnabled ? items.reduce((s,it)=> s + ((Number(it.qty)||0)*(Number(it.rate)||0)) * ((Number(it.gstRate)||0)/100), 0) : 0;
    const billTotal = taxableTotal + gstTotal;
    const totalPayable = billTotal + (Number(previousBalance)||0);
    const balanceDue = clamp0(totalPayable - (Number(receivedAmount)||0));
    return {taxableTotal, gstTotal, billTotal, totalPayable, balanceDue};
  },
  validateBill(b){
    if(!b.customerName || !b.customerName.trim()) return 'Enter the customer name.';
    if(!b.mobile || !b.mobile.trim()) return 'Enter the mobile number.';
    if(!b.items || !b.items.filter(it=>it.productCode).length) return 'Add at least one product.';
    if(!b.paymentMode) return 'Select a payment mode.';
    if(b.paymentMode!=='CREDIT'){
      if(b.receivedAmount===''||b.receivedAmount==null) return 'Enter the received amount.';
      if(isNaN(Number(b.receivedAmount)) || Number(b.receivedAmount)<0) return 'Enter a valid received amount.';
    }
    return null;
  },
  // Save a brand-new bill. Returns {invoice, lowStock:[]}
  async saveBill(b){
    const err = DB.validateBill(b); if(err) throw new Error(err);
    const items = b.items.filter(it=>it.productCode && Number(it.qty)>0);
    const cust = await DB.getOrCreateCustomer(b.mobile, b.customerName);
    const previousBalance = Number(cust.balance)||0;
    const receivedAmount = b.paymentMode==='CREDIT' ? (Number(b.receivedAmount)||0) : Number(b.receivedAmount)||0;
    const gstEnabled = !!App.company.gstEnabled;
    const {taxableTotal,gstTotal,billTotal,totalPayable,balanceDue} = DB.computeTotals(items, previousBalance, receivedAmount, gstEnabled);
    // Profit & Loss: cost is snapshotted per item at billing time (costRate, set when the
    // item was added to the bill from the product's current Purchase Cost) — this way a
    // later change to the product's cost never rewrites the profit on a past bill.
    const totalCost = items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.costRate)||0), 0);
    const grossProfit = taxableTotal - totalCost;
    const invId = uid();
    const invoice = {
      id: invId, invoiceNo: b.invoiceNo, date: b.date, customerId: cust.id, customerName: cust.name,
      mobile: cust.mobile, paymentMode: b.paymentMode, billTotal, previousBalance, currentBill: billTotal,
      totalPayable, receivedAmount, balanceDue, status:'COMPLETED', createdAt: new Date().toISOString(),
      gstEnabled, taxableTotal, gstTotal, totalCost, grossProfit
    };
    await App.store.put('invoices', invoice);
    for(const it of items){
      const amount = Number(it.qty)*Number(it.rate);
      const gstRate = gstEnabled ? (Number(it.gstRate)||0) : 0;
      const costRate = Number(it.costRate)||0;
      const itemProfit = amount - costRate*Number(it.qty);
      await App.store.put('saleItems', {id:uid(), invoiceNo:invId, productCode:it.productCode, productName:it.productName, qty:Number(it.qty), rate:Number(it.rate), amount, hsn: it.hsn||'', gstRate, gstAmount: amount*gstRate/100, costRate, itemProfit});
    }
    // customer balance = new outstanding balance due (mirrors Excel UpdateCustomerBalance)
    cust.balance = balanceDue;
    await App.masterStore.put('customers', cust);
    // Ledger entry is written for EVERY bill, not just CREDIT ones — a CASH
    // bill with a partial payment still leaves the customer owing money, and
    // that needs a ledger trail too (previously only CREDIT bills were
    // logged, so a customer statement/date-filter could silently miss real
    // outstanding transactions).
    await App.store.put('ledger', {id:uid(), date:b.date, invoiceNo:b.invoiceNo, customerId:cust.id, customerName:cust.name, mobile:cust.mobile, debit: clamp0(billTotal-receivedAmount), credit:0, balance: balanceDue, remarks:''});
    const lowStock = await DB.deductStock(items);
    return {invoice, lowStock};
  },
  async deductStock(items){
    const low = [];
    for(const it of items){
      const p = await DB.findProductByCode(it.productCode);
      if(!p) continue;
      p.stock = (Number(p.stock)||0) - (Number(it.qty)||0);
      await App.masterStore.put('products', p);
      if(p.lowStockLimit>0 && p.stock<=p.lowStockLimit) low.push(p);
    }
    return low;
  },
  async restoreStockForInvoiceRow(invRow){
    if(!invRow || invRow.status!=='COMPLETED') return;
    const items = await DB.itemsForInvoiceRow(invRow.id);
    for(const it of items){
      const p = await DB.findProductByCode(it.productCode);
      if(!p) continue;
      p.stock = (Number(p.stock)||0) + (Number(it.qty)||0);
      await App.masterStore.put('products', p);
    }
  },
  async cancelBill(invoiceNo){
    const row = await DB.currentInvoiceRow(invoiceNo);
    if(!row) throw new Error('Invoice not found: '+invoiceNo);
    if(row.status==='CANCELLED') throw new Error('This invoice is already cancelled.');
    await DB.restoreStockForInvoiceRow(row);
    // reverse this bill's contribution to the customer's outstanding balance
    const cust = await App.masterStore.get('customers', row.customerId);
    if(cust){
      cust.balance = clamp0((Number(cust.balance)||0) - (Number(row.balanceDue)||0));
      await App.masterStore.put('customers', cust);
      await App.store.put('ledger', {id:uid(), date: todayISO(), invoiceNo: invoiceNo+' (CANCELLED)', customerId:cust.id, customerName:cust.name, mobile:cust.mobile, debit:0, credit: clamp0(row.billTotal-row.receivedAmount), balance: cust.balance, remarks:'Bill cancelled'});
    }
    row.status = 'CANCELLED';
    await App.store.put('invoices', row);
    return row;
  },
  async loadBillForModify(invoiceNo){
    const row = await DB.currentInvoiceRow(invoiceNo);
    if(!row) throw new Error('Invoice not found: '+invoiceNo);
    if(row.status==='CANCELLED') throw new Error('A cancelled invoice cannot be modified.');
    const items = await DB.itemsForInvoiceRow(row.id);
    return {row, items};
  },
  async modifyBill(oldInvoiceNo, b){
    const err = DB.validateBill(b); if(err) throw new Error(err);
    const oldRow = await DB.currentInvoiceRow(oldInvoiceNo);
    if(!oldRow) throw new Error('Original invoice not found.');
    if(oldRow.status==='CANCELLED') throw new Error('A cancelled invoice cannot be modified.');
    await DB.restoreStockForInvoiceRow(oldRow);
    oldRow.status='MODIFIED';
    await App.store.put('invoices', oldRow);
    // Recompute against customer's balance with old contribution removed
    const cust = await App.masterStore.get('customers', oldRow.customerId);
    if(cust){ cust.balance = clamp0((Number(cust.balance)||0) - (Number(oldRow.balanceDue)||0)); await App.masterStore.put('customers', cust); }
    const items = b.items.filter(it=>it.productCode && Number(it.qty)>0);
    const previousBalance = cust ? Number(cust.balance)||0 : 0;
    const receivedAmount = Number(b.receivedAmount)||0;
    const gstEnabled = !!App.company.gstEnabled;
    const {taxableTotal,gstTotal,billTotal,totalPayable,balanceDue} = DB.computeTotals(items, previousBalance, receivedAmount, gstEnabled);
    const totalCost = items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.costRate)||0), 0);
    const grossProfit = taxableTotal - totalCost;
    const invId = uid();
    const invoice = {
      id: invId, invoiceNo: oldInvoiceNo, date: b.date, customerId: cust?cust.id:oldRow.customerId,
      customerName: b.customerName, mobile: b.mobile, paymentMode: b.paymentMode, billTotal, previousBalance,
      currentBill: billTotal, totalPayable, receivedAmount, balanceDue, status:'COMPLETED', createdAt: new Date().toISOString(),
      gstEnabled, taxableTotal, gstTotal, totalCost, grossProfit
    };
    await App.store.put('invoices', invoice);
    for(const it of items){
      const amount = Number(it.qty)*Number(it.rate);
      const gstRate = gstEnabled ? (Number(it.gstRate)||0) : 0;
      const costRate = Number(it.costRate)||0;
      const itemProfit = amount - costRate*Number(it.qty);
      await App.store.put('saleItems', {id:uid(), invoiceNo:invId, productCode:it.productCode, productName:it.productName, qty:Number(it.qty), rate:Number(it.rate), amount, hsn: it.hsn||'', gstRate, gstAmount: amount*gstRate/100, costRate, itemProfit});
    }
    if(cust){ cust.balance = balanceDue; cust.name = b.customerName; cust.mobile = b.mobile; await App.masterStore.put('customers', cust); }
    if(cust){
      await App.store.put('ledger', {id:uid(), date:b.date, invoiceNo: oldInvoiceNo+' (MODIFIED)', customerId:cust.id, customerName:cust.name, mobile:cust.mobile, debit: clamp0(billTotal-receivedAmount), credit:0, balance: balanceDue, remarks:''});
    }
    const lowStock = await DB.deductStock(items);
    return {invoice, lowStock};
  },
  async receivePayment(p){
    const cust = await App.masterStore.get('customers', p.customerId);
    if(!cust) throw new Error('Customer not found.');
    const amount = Number(p.amount)||0;
    if(amount<=0) throw new Error('Enter a valid amount.');
    const previousBalance = Number(cust.balance)||0;
    const balanceAfter = previousBalance - amount;
    const receiptNo = await DB.nextReceiptNo();
    const payment = {id:receiptNo, date: p.date||todayISO(), customerId:cust.id, customerName:cust.name, mobile:cust.mobile,
      paymentMode: p.mode, amountReceived: amount, previousBalance, balanceAfter, remarks: p.remarks||'', status:'RECEIVED', receivedBy: App.company.name||'admin'};
    await App.store.put('payments', payment);
    cust.balance = clamp0(balanceAfter);
    await App.masterStore.put('customers', cust);
    await App.store.put('ledger', {id:uid(), date:payment.date, invoiceNo: receiptNo, customerId:cust.id, customerName:cust.name, mobile:cust.mobile, debit:0, credit:amount, balance: cust.balance, remarks: p.remarks||''});
    return payment;
  },
  async addStock(productCode, qty){
    const p = await DB.findProductByCode(productCode);
    if(!p) throw new Error('Product not found.');
    qty = Number(qty);
    if(!(qty>0)) throw new Error('Enter a valid quantity.');
    p.stock = (Number(p.stock)||0) + qty;
    await App.masterStore.put('products', p);
    return p;
  },
  async lowStockList(){
    const all = await App.masterStore.all('products');
    return all.filter(p=> p.lowStockLimit>0 && Number(p.stock)<=Number(p.lowStockLimit));
  },
  async currentInvoicesInRange(fromISO, toISO){
    const all = await App.store.all('invoices');
    const byNo = {};
    all.forEach(r=>{ if(!byNo[r.invoiceNo] || r.createdAt>byNo[r.invoiceNo].createdAt) byNo[r.invoiceNo]=r; });
    return Object.values(byNo).filter(r=> r.date>=fromISO && r.date<=toISO).sort((a,b)=> a.date<b.date?1:-1);
  },
  /* ---------------- Quotations / Estimates ----------------
     A quotation is a non-binding estimate: unlike a Sale Bill it never
     touches stock or a customer's balance/ledger. It can later be turned
     into a real bill with one tap (see convertQuotationToBill / the
     "Convert to Bill" button) — that just hands its customer + items over to
     the SAME New Bill screen used for any other bill, so saving that bill
     goes through the exact same DB.saveBill() path (stock deduction, ledger
     entry, customer balance update) as always. No business logic is
     duplicated here. */
  async nextQuotationNo(){
    const fy = financialYear();
    const prefix = App.company.quotationPrefix || 'QUO';
    const all = await App.store.all('quotations');
    const re = new RegExp('^'+prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'/'+fy+'/(\\d+)$');
    let max=0;
    all.forEach(q=>{ const m = re.exec(q.quoteNo||''); if(m){ const n=parseInt(m[1],10); if(n>max) max=n; } });
    return prefix+'/'+fy+'/'+String(max+1).padStart(6,'0');
  },
  validateQuotation(q){
    if(!q.customerName || !q.customerName.trim()) return 'Enter the customer name.';
    if(!q.items || !q.items.filter(it=>it.productCode && Number(it.qty)>0).length) return 'Add at least one product.';
    return null;
  },
  async saveQuotation(q){
    const err = DB.validateQuotation(q); if(err) throw new Error(err);
    const items = q.items.filter(it=>it.productCode && Number(it.qty)>0);
    const gstEnabled = !!App.company.gstEnabled;
    const {taxableTotal,gstTotal,billTotal} = DB.computeTotals(items, 0, 0, gstEnabled);
    const qId = uid();
    const quotation = {
      id:qId, quoteNo:q.quoteNo, date:q.date, validTill:q.validTill||'', customerId:q.customerId||null,
      customerName:q.customerName, mobile:q.mobile||'', quoteTotal:billTotal, taxableTotal, gstTotal, gstEnabled,
      status:'OPEN', convertedInvoiceNo:'', createdAt:new Date().toISOString(),
    };
    await App.store.put('quotations', quotation);
    for(const it of items){
      const amount = Number(it.qty)*Number(it.rate);
      const gstRate = gstEnabled ? (Number(it.gstRate)||0) : 0;
      await App.store.put('quotationItems', {id:uid(), quoteRowId:qId, productCode:it.productCode, productName:it.productName, qty:Number(it.qty), rate:Number(it.rate), amount, hsn:it.hsn||'', gstRate, gstAmount: amount*gstRate/100});
    }
    return quotation;
  },
  async itemsForQuotationRow(quoteRowId){
    return App.store.byIndex('quotationItems','quoteRowId', quoteRowId);
  },
  async currentQuotationsInRange(fromISO, toISO){
    const all = await App.store.all('quotations');
    return all.filter(r=> r.date>=fromISO && r.date<=toISO).sort((a,b)=> a.date<b.date?1:-1);
  },
  async cancelQuotation(quoteRowId){
    const q = await App.store.get('quotations', quoteRowId);
    if(!q) throw new Error('Quotation not found.');
    if(q.status==='CONVERTED') throw new Error('This quotation has already been converted to a bill and cannot be cancelled.');
    q.status = 'CANCELLED';
    await App.store.put('quotations', q);
    return q;
  },
  async markQuotationConverted(quoteRowId, invoiceNo){
    const q = await App.store.get('quotations', quoteRowId);
    if(!q) return;
    q.status = 'CONVERTED'; q.convertedInvoiceNo = invoiceNo;
    await App.store.put('quotations', q);
  },
  async ledgerForCustomer(customerId){
    const rows = await App.store.byIndex('ledger','customerId', customerId);
    return rows.sort((a,b)=> (a.date||'')<(b.date||'')?1:-1);
  },

  /* ---------------- Purchases (party-wise bill entry + payments + ledger) ----------------
     Mirrors the Sales/Customer system above: Suppliers are "parties" you owe
     money to, a Purchase Bill increases stock (goods coming IN) and increases
     what you owe that party, and paying them (Pay Supplier) decreases it.
     Ledger entries reuse the exact same shape as customer ledger rows
     (date/invoiceNo/debit/credit/balance) so filterLedgerRange/ledgerTable/
     generateLedgerPdf all work unchanged for suppliers too. */
  async nextSupplierId(){
    const all = await App.store.all('suppliers');
    let max=0;
    all.forEach(s=>{ const m=/^SUP(\d+)$/.exec(s.id||''); if(m){ const n=parseInt(m[1],10); if(n>max) max=n; } });
    return 'SUP'+String(max+1).padStart(6,'0');
  },
  async nextPurchaseNo(){
    const fy = financialYear();
    const prefix = App.company.purchasePrefix || 'PUR';
    const all = await App.store.all('purchases');
    const re = new RegExp('^'+prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'/'+fy+'/(\\d+)$');
    let max=0;
    all.forEach(row=>{ const m = re.exec(row.purchaseNo||''); if(m){ const n=parseInt(m[1],10); if(n>max) max=n; } });
    return prefix+'/'+fy+'/'+String(max+1).padStart(6,'0');
  },
  async nextPayoutNo(){
    const all = await App.store.all('payouts');
    let max=0;
    all.forEach(p=>{ const m=/^PY(\d+)$/.exec(p.id||''); if(m){ const n=parseInt(m[1],10); if(n>max) max=n; } });
    return 'PY'+String(max+1).padStart(6,'0');
  },
  async findSupplierByMobile(mobile){
    mobile = String(mobile||'').trim();
    if(!mobile) return null;
    const all = await App.store.all('suppliers');
    return all.find(s=>String(s.mobile||'').trim()===mobile) || null;
  },
  async searchSuppliers(text){
    const all = await App.store.all('suppliers');
    text = (text||'').trim().toLowerCase();
    if(!text) return all;
    return all.filter(s=> (s.name||'').toLowerCase().includes(text) || String(s.mobile||'').includes(text) || (s.id||'').toLowerCase().includes(text));
  },
  async getOrCreateSupplier(mobile, name){
    mobile = String(mobile||'').trim(); name = (name||'').trim();
    let sup = await DB.findSupplierByMobile(mobile);
    if(sup){
      if(name && sup.name!==name){ sup.name = name; await App.store.put('suppliers', sup); }
      return sup;
    }
    sup = {id: await DB.nextSupplierId(), mobile, name: name||'Supplier', balance:0, createdAt: new Date().toISOString()};
    await App.store.put('suppliers', sup);
    return sup;
  },
  validatePurchaseBill(b){
    if(!b.partyName || !b.partyName.trim()) return 'Enter the party name.';
    if(!b.mobile || !b.mobile.trim()) return 'Enter the mobile number.';
    if(!b.items || !b.items.filter(it=>it.productCode).length) return 'Add at least one product.';
    if(!b.paymentMode) return 'Select a payment mode.';
    if(b.paymentMode!=='CREDIT'){
      if(b.paidAmount===''||b.paidAmount==null) return 'Enter the paid amount.';
      if(isNaN(Number(b.paidAmount)) || Number(b.paidAmount)<0) return 'Enter a valid paid amount.';
    }
    return null;
  },
  async addStockForItems(items){
    for(const it of items){
      const p = await DB.findProductByCode(it.productCode);
      if(!p) continue;
      p.stock = (Number(p.stock)||0) + (Number(it.qty)||0);
      // Keep the product's Purchase Cost current with the last purchase rate paid —
      // this is what the Profit & Loss report and future Purchase Bill entries use as cost.
      if(Number(it.rate)>0) p.purchaseRate = Number(it.rate);
      await App.masterStore.put('products', p);
    }
  },
  async removeStockForItems(items){
    for(const it of items){
      const p = await DB.findProductByCode(it.productCode);
      if(!p) continue;
      p.stock = (Number(p.stock)||0) - (Number(it.qty)||0);
      await App.masterStore.put('products', p);
    }
  },
  // Save a brand-new purchase bill. Returns {purchase}
  async savePurchaseBill(b){
    const err = DB.validatePurchaseBill(b); if(err) throw new Error(err);
    const items = b.items.filter(it=>it.productCode && Number(it.qty)>0);
    const sup = await DB.getOrCreateSupplier(b.mobile, b.partyName);
    const previousBalance = Number(sup.balance)||0;
    const paidAmount = Number(b.paidAmount)||0;
    const {billTotal,totalPayable,balanceDue} = DB.computeTotals(items, previousBalance, paidAmount, false);
    const rowId = uid();
    const purchase = {
      id: rowId, purchaseNo: b.purchaseNo, date: b.date, supplierId: sup.id, supplierName: sup.name,
      mobile: sup.mobile, paymentMode: b.paymentMode, billTotal, previousBalance, currentBill: billTotal,
      totalPayable, paidAmount, balanceDue, status:'COMPLETED', createdAt: new Date().toISOString(),
    };
    await App.store.put('purchases', purchase);
    for(const it of items){
      const amount = Number(it.qty)*Number(it.rate);
      await App.store.put('purchaseItems', {id:uid(), purchaseRowId:rowId, productCode:it.productCode, productName:it.productName, qty:Number(it.qty), rate:Number(it.rate), amount});
    }
    // supplier balance = new outstanding amount PAYABLE to them
    sup.balance = balanceDue;
    await App.store.put('suppliers', sup);
    await App.store.put('supplierLedger', {id:uid(), date:b.date, invoiceNo:b.purchaseNo, supplierId:sup.id, supplierName:sup.name, mobile:sup.mobile, debit: clamp0(billTotal-paidAmount), credit:0, balance: balanceDue, remarks:''});
    await DB.addStockForItems(items);
    return {purchase};
  },
  async currentPurchaseRow(purchaseNo){
    const rows = await App.store.byIndex('purchases','purchaseNo', purchaseNo);
    const active = rows.filter(r=>r.status==='COMPLETED');
    if(active.length) return active.sort((a,b)=> (a.createdAt<b.createdAt?1:-1))[0];
    if(rows.length) return rows.sort((a,b)=> (a.createdAt<b.createdAt?1:-1))[0];
    return null;
  },
  async itemsForPurchaseRow(rowId){
    return App.store.byIndex('purchaseItems','purchaseRowId', rowId);
  },
  async cancelPurchaseBill(purchaseNo){
    const row = await DB.currentPurchaseRow(purchaseNo);
    if(!row) throw new Error('Purchase bill not found: '+purchaseNo);
    if(row.status==='CANCELLED') throw new Error('This purchase bill is already cancelled.');
    const items = await DB.itemsForPurchaseRow(row.id);
    await DB.removeStockForItems(items);
    const sup = await App.store.get('suppliers', row.supplierId);
    if(sup){
      sup.balance = clamp0((Number(sup.balance)||0) - (Number(row.balanceDue)||0));
      await App.store.put('suppliers', sup);
      await App.store.put('supplierLedger', {id:uid(), date: todayISO(), invoiceNo: purchaseNo+' (CANCELLED)', supplierId:sup.id, supplierName:sup.name, mobile:sup.mobile, debit:0, credit: clamp0(row.billTotal-row.paidAmount), balance: sup.balance, remarks:'Bill cancelled'});
    }
    row.status = 'CANCELLED';
    await App.store.put('purchases', row);
    return row;
  },
  async loadPurchaseBillForModify(purchaseNo){
    const row = await DB.currentPurchaseRow(purchaseNo);
    if(!row) throw new Error('Purchase bill not found: '+purchaseNo);
    if(row.status==='CANCELLED') throw new Error('A cancelled purchase bill cannot be modified.');
    const items = await DB.itemsForPurchaseRow(row.id);
    return {row, items};
  },
  async modifyPurchaseBill(oldPurchaseNo, b){
    const err = DB.validatePurchaseBill(b); if(err) throw new Error(err);
    const oldRow = await DB.currentPurchaseRow(oldPurchaseNo);
    if(!oldRow) throw new Error('Original purchase bill not found.');
    if(oldRow.status==='CANCELLED') throw new Error('A cancelled purchase bill cannot be modified.');
    const oldItems = await DB.itemsForPurchaseRow(oldRow.id);
    await DB.removeStockForItems(oldItems);
    oldRow.status='MODIFIED';
    await App.store.put('purchases', oldRow);
    const sup = await App.store.get('suppliers', oldRow.supplierId);
    if(sup){ sup.balance = clamp0((Number(sup.balance)||0) - (Number(oldRow.balanceDue)||0)); await App.store.put('suppliers', sup); }
    const items = b.items.filter(it=>it.productCode && Number(it.qty)>0);
    const previousBalance = sup ? Number(sup.balance)||0 : 0;
    const paidAmount = Number(b.paidAmount)||0;
    const {billTotal,totalPayable,balanceDue} = DB.computeTotals(items, previousBalance, paidAmount, false);
    const rowId = uid();
    const purchase = {
      id: rowId, purchaseNo: oldPurchaseNo, date: b.date, supplierId: sup?sup.id:oldRow.supplierId,
      supplierName: b.partyName, mobile: b.mobile, paymentMode: b.paymentMode, billTotal, previousBalance,
      currentBill: billTotal, totalPayable, paidAmount, balanceDue, status:'COMPLETED', createdAt: new Date().toISOString(),
    };
    await App.store.put('purchases', purchase);
    for(const it of items){
      const amount = Number(it.qty)*Number(it.rate);
      await App.store.put('purchaseItems', {id:uid(), purchaseRowId:rowId, productCode:it.productCode, productName:it.productName, qty:Number(it.qty), rate:Number(it.rate), amount});
    }
    if(sup){ sup.balance = balanceDue; sup.name = b.partyName; sup.mobile = b.mobile; await App.store.put('suppliers', sup); }
    if(sup){
      await App.store.put('supplierLedger', {id:uid(), date:b.date, invoiceNo: oldPurchaseNo+' (MODIFIED)', supplierId:sup.id, supplierName:sup.name, mobile:sup.mobile, debit: clamp0(billTotal-paidAmount), credit:0, balance: balanceDue, remarks:''});
    }
    await DB.addStockForItems(items);
    return {purchase};
  },
  async paySupplier(p){
    const sup = await App.store.get('suppliers', p.supplierId);
    if(!sup) throw new Error('Party not found.');
    const amount = Number(p.amount)||0;
    if(amount<=0) throw new Error('Enter a valid amount.');
    const previousBalance = Number(sup.balance)||0;
    const balanceAfter = previousBalance - amount;
    const payoutNo = await DB.nextPayoutNo();
    const payout = {id:payoutNo, date: p.date||todayISO(), supplierId:sup.id, supplierName:sup.name, mobile:sup.mobile,
      paymentMode: p.mode, amountPaid: amount, previousBalance, balanceAfter, remarks: p.remarks||'', status:'PAID', paidBy: App.company.name||'admin'};
    await App.store.put('payouts', payout);
    sup.balance = clamp0(balanceAfter);
    await App.store.put('suppliers', sup);
    await App.store.put('supplierLedger', {id:uid(), date:payout.date, invoiceNo: payoutNo, supplierId:sup.id, supplierName:sup.name, mobile:sup.mobile, debit:0, credit:amount, balance: sup.balance, remarks: p.remarks||''});
    return payout;
  },
  async ledgerForSupplier(supplierId){
    const rows = await App.store.byIndex('supplierLedger','supplierId', supplierId);
    return rows.sort((a,b)=> (a.date||'')<(b.date||'')?1:-1);
  },
  async currentPurchasesInRange(fromISO, toISO){
    const all = await App.store.all('purchases');
    const byNo = {};
    all.forEach(r=>{ if(!byNo[r.purchaseNo] || r.createdAt>byNo[r.purchaseNo].createdAt) byNo[r.purchaseNo]=r; });
    return Object.values(byNo).filter(r=> r.date>=fromISO && r.date<=toISO).sort((a,b)=> a.date<b.date?1:-1);
  },
};

/* ---------------- Router ---------------- */
const routes = {};
function on(route, fn){ routes[route]=fn; }
function navigate(route){ location.hash = route; }
window.addEventListener('hashchange', renderRoute);
function currentRoute(){ return location.hash || '#/dashboard'; }
async function renderRoute(){
  App.route = currentRoute();
  const [path, qs] = App.route.split('?');
  const parts = path.split('/').filter(Boolean); // ['#','dashboard'] etc -> after split '#' empty
  // Try the full remaining path first (so a distinctly-registered sub-route like
  // '#/reports/monthly' is matched exactly), falling back to just the first segment
  // (so a generic '#/bill/new'-style URL still reaches its single-segment handler).
  const fullKey = '#/'+parts.slice(1).join('/');
  const shortKey = '#/'+(parts[1]||'dashboard');
  const key = routes[fullKey] ? fullKey : shortKey;
  const params = new URLSearchParams(qs||'');
  renderShell();
  const main = $('#view-root');
  main.innerHTML = '';
  const handler = routes[key] || routes['#/dashboard'];
  try{
    await handler(main, params);
  }catch(e){
    console.error(e);
    main.appendChild(el('div',{class:'card pad'},['Error: '+e.message]));
  }
  highlightNav(key);
  window.scrollTo(0,0);
}

  const app = $('#app');
  app.innerHTML = '';
  const topbar = el('div',{class:'topbar'},[
    el('div',{class:'brand', onclick:()=>navigate('#/settings')},[
      el('div',{class:'brand-badge'},[(App.company.name||'?').trim().charAt(0).toUpperCase()]),
      el('div',{},[
        el('div',{class:'brand-name'},[App.company.name||'My Business']),
        el('div',{class:'brand-sub'},[App.company.tagline || 'Billing & Inventory']),
      ]),
    ]),
    el('div',{id:'clock',class:'clock'},[]),
    el('button',{class:'icon-btn', title:'Companies', onclick:()=>openCompanySwitcher()},[iconSwap()]),
  ]);
  const sidenav = el('div',{class:'sidenav'});
  NAV_ITEMS.forEach(it=> sidenav.appendChild(navItem(it)));
  if((App.userEmail||'').toLowerCase()===ADMIN_EMAIL.toLowerCase()){
    sidenav.appendChild(navItem({key:'#/admin', label:'Paid Accounts (Admin)', icon:iconLock}));
  }
  const main = el('div',{class:'main', id:'view-root'});
  const shell = el('div',{class:'shell'},[sidenav, main]);
  const bottomnav = el('div',{class:'bottomnav'});
  BOTTOM_ITEMS.forEach(k=>{
    // '#/more' is a bottom-nav-only entry (not a real sidenav item), so it has no
    // matching NAV_ITEMS record — fall back to the dedicated dots icon for it.
    const item = NAV_ITEMS.find(n=>n.key===k) || {icon: iconMore};
    const b = el('div',{class:'navitem', 'data-key':k, onclick:()=>navigate(k)},[item.icon(), el('span',{},[BOTTOM_LABELS[k]])]);
    bottomnav.appendChild(b);
  });
  app.appendChild(topbar); app.appendChild(shell); app.appendChild(bottomnav);
  updateClock();
  if(App.clockTimer) clearInterval(App.clockTimer);
  App.clockTimer = setInterval(updateClock, 1000);
}
function navItem(it){
  return el('div',{class:'navitem','data-key':it.key, onclick:()=>navigate(it.key)},[it.icon(), el('span',{},[it.label])]);
}
function highlightNav(activeKey){
  // The mobile bottom-nav's "More" tab (data-key="#/more") stands in for every
  // screen that isn't one of the 4 primary bottom tabs — including screens (like
  // Purchase/Quotation/Reports/Settings) that are only reachable THROUGH the More
  // screen on mobile — so it should stay highlighted while any of those are open.
  const primaryBottomKeys = ['#/dashboard','#/bill','#/customers','#/products'];
  document.querySelectorAll('.navitem').forEach(n=>{
    const k = n.getAttribute('data-key');
    const isActive = k===activeKey || (k==='#/more' && !primaryBottomKeys.includes(activeKey));
    n.classList.toggle('active', isActive);
  });
}
function updateClock(){
  const c = $('#clock'); if(!c) return;
  const now = new Date();
  c.innerHTML='';
  c.appendChild(el('div',{class:'time num'},[now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})]));
  c.appendChild(el('div',{class:'date'},[now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',weekday:'short'})]));
}

/* ---------------- Modal helper ---------------- */
/* Modals stack: opening a modal (eg. a search picker) from inside an
   already-open modal layers on top of it instead of destroying it.
   closeModal() closes only the top-most layer. This matters because
   several flows open a picker/confirm dialog while a parent modal
   (Receive Payment, Pay Supplier, Cancel Bill, etc.) is still open and
   needs to remain intact underneath. */
let modalStack = [];
function openModal(title, bodyEl, opts){
  opts = opts||{};
  const root = $('#modal-root');
  const back = el('div',{class:'modal-backdrop', onclick:(e)=>{ if(e.target===back && !opts.persist) closeModal(); }});
  const modal = el('div',{class:'modal'},[
    el('div',{class:'modal-head'},[ el('h3',{},[title]), el('button',{class:'icon-btn', onclick:closeModal},[iconClose()]) ]),
  ]);
  modal.appendChild(bodyEl);
  back.appendChild(modal);
  root.appendChild(back);
  modalStack.push(back);
}
function closeModal(){
  const top = modalStack.pop();
  if(top && top.parentNode) top.parentNode.removeChild(top);
  if(!modalStack.length){ $('#modal-root').innerHTML=''; }
}

function confirmDialog(msg, okLabel){
  return new Promise(resolve=>{
    const body = el('div',{class:'stack'},[
      el('div',{},[msg]),
      el('div',{class:'row', style:'justify-content:flex-end'},[
        el('button',{class:'btn', onclick:()=>{closeModal(); resolve(false);}},['Cancel']),
        el('button',{class:'btn btn-danger', onclick:()=>{closeModal(); resolve(true);}},[okLabel||'Confirm']),
      ]),
    ]);
    openModal('Confirm', body, {persist:true});
  });
}

/* ---------------- Reusable search picker ---------------- */
function pickerModal(opts){
  // opts: {title, placeholder, fetchItems(query)->Promise<arr>, renderRow(item)->el, onSelect(item), extraTop?, addNewLabel?, onAddNew(query)?}
  const body = el('div',{class:'stack'});
  const searchWrap = el('div',{class:'searchbox'},[iconSearch(), el('input',{placeholder:opts.placeholder||'Search...', id:'picker-input'})]);
  const results = el('div',{id:'picker-results'},[]);
  body.appendChild(searchWrap);
  if(opts.extraTop) body.appendChild(opts.extraTop);
  if(opts.onAddNew){
    body.appendChild(el('button',{class:'btn btn-sm btn-block', onclick:()=>{ const q=(input.value||'').trim(); closeModal(); opts.onAddNew(q); }},[iconPlus(), opts.addNewLabel||'+ Add New']));
  }
  body.appendChild(results);
  openModal(opts.title, body);
  const input = $('#picker-input');
  input.focus();
  async function refresh(q){
    const items = await opts.fetchItems(q);
    results.innerHTML='';
    if(!items.length){ results.appendChild(el('div',{class:'empty small'},['Nothing found.'])); return; }
    items.slice(0,50).forEach(it=>{
      const row = opts.renderRow(it);
      row.classList.add('list-row');
      row.addEventListener('click', ()=>{ closeModal(); opts.onSelect(it); });
      results.appendChild(row);
    });
  }
  input.addEventListener('input', debounce(()=>refresh(input.value),150));
  refresh('');
}
